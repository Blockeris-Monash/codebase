<style>
:root{
  --bg:#fffdfb; --panel:#ffffff; --sunk:#f6f1ec; --line:#e8dfd6; --ink:#211b16; --mute:#7a6d63;
  --accent:#e8620c; --accent-ink:#ffffff; --accent-soft:#fdeadb; --hl:#ffd54a; --hl-ink:#211b16;
  --bad:#c62828; --bad-soft:#fde8e6; --rev:#8a5a00; --rev-soft:#fff0b8; --ok:#1f8a4c; --ok-soft:#e2f4e9;
  color-scheme:light;

  --card:0 1px 2px rgba(150,70,20,.06),0 8px 24px rgba(150,70,20,.10);
  --bg-grad:radial-gradient(900px 520px at 6% 0%,#ffd9b8 0%,transparent 62%),radial-gradient(800px 520px at 100% 18%,#ffd3d6 0%,transparent 60%),radial-gradient(900px 600px at 45% 100%,#fff0b5 0%,transparent 62%),#fff8f1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1e1a17; --panel:#292420; --sunk:#302a25; --line:#453b33; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312; --hl:#8a5a10; --hl-ink:#fff3dc;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);
  --card:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.38);
  --bg-grad:radial-gradient(900px 520px at 6% 0%,#5a3216 0%,transparent 62%),radial-gradient(800px 520px at 100% 18%,#4d2532 0%,transparent 60%),radial-gradient(900px 600px at 45% 100%,#43391a 0%,transparent 62%),#1e1a17;}}
:root[data-theme="dark"]{
  --bg:#1e1a17; --panel:#292420; --sunk:#302a25; --line:#453b33; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312; --hl:#8a5a10; --hl-ink:#fff3dc;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  color-scheme:dark;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);
  --card:0 1px 2px rgba(0,0,0,.30),0 8px 24px rgba(0,0,0,.38);
  --bg-grad:radial-gradient(900px 520px at 6% 0%,#5a3216 0%,transparent 62%),radial-gradient(800px 520px at 100% 18%,#4d2532 0%,transparent 60%),radial-gradient(900px 600px at 45% 100%,#43391a 0%,transparent 62%),#1e1a17;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-grad,var(--bg));background-attachment:fixed;min-height:100vh;color:var(--ink);font:0.9375rem/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.authbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:var(--bad-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:0.875rem}
.authbar button{border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--panel);min-height:32px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line);background:var(--panel);box-shadow:var(--card);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;flex:none;overflow:visible}
.mark .ink{fill:var(--ink)}
.mark .paper{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.9;stroke-linejoin:round}
.mark .win{fill:var(--panel)}
.mark .ring{fill:none;stroke:var(--ink);stroke-width:2.4}
.mark .line{fill:none;stroke:var(--accent);stroke-linecap:round}
.mark .keel{fill:none;stroke:var(--panel);stroke-width:.9}
.mark .ring{stroke-dasharray:100}
.mark .doc,.mark .fly{transform-box:fill-box;transform-origin:center}
.mark .jet{fill:var(--accent);stroke:var(--panel);stroke-width:1.3;stroke-linejoin:round;paint-order:stroke}
.mark .trail{stroke-dasharray:2 3;opacity:.8}
.mark.go .ring,.brand:hover .mark .ring{animation:draw 1.1s ease-out 1}
.mark.go .ship,.brand:hover .mark .ship{animation:rise 1.2s cubic-bezier(.3,1.5,.5,1) 1}
.mark.go .waves,.brand:hover .mark .waves{animation:roll 4s linear infinite}
/* plays when the page opens (about 4 seconds) and for as long as the pointer is over the logo: a sheet pops out of the sea, floats, flies up and folds into a plane, which flies off to the right while the next sheet pops up */
.mark.go .doc,.brand:hover .mark .doc{animation:docloop 7s ease-in-out -.32s infinite}
.mark.go .fly,.brand:hover .mark .fly{animation:planeloop 7s ease-in-out -.32s infinite}
.mark.go .trail,.brand:hover .mark .trail{animation:trailloop 7s linear -.32s infinite}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes roll{to{transform:translateX(-40px)}}
@keyframes docloop{
  0%{transform:translate(2px,-11px);opacity:1}
  4%{transform:translate(2px,-11px) scale(.1,1) rotate(22deg);opacity:0}
  4.5%{transform:translate(0,36px);opacity:0}
  5%{transform:translate(0,36px);opacity:1}
  15%{transform:translate(0,-3px)}
  18%{transform:none}
  30%{transform:translate(0,-2px) rotate(-2deg)}
  44%{transform:translate(0,1px) rotate(2deg)}
  58%{transform:translate(0,-2px) rotate(-1deg)}
  100%{transform:translate(2px,-11px);opacity:1}}
@keyframes planeloop{
  0%{transform:translate(-29px,13px) scale(.2,1) rotate(-30deg);opacity:0}
  4%{transform:translate(-29px,13px);opacity:1}
  8%{transform:translate(-29px,10px)}
  11%{transform:translate(-27px,11px)}
  22%{transform:translate(-9px,0) scale(1.08);opacity:1}
  28%{transform:translate(13px,-7px);opacity:1}
  34%{transform:translate(29px,-11px);opacity:0}
  100%{transform:translate(29px,-11px);opacity:0}}
@keyframes trailloop{
  0%,8%{opacity:0;stroke-dashoffset:0}
  13%{opacity:.8}
  30%{opacity:.5}
  36%{opacity:0;stroke-dashoffset:-30}
  100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.mark *{animation:none!important}}
.logo{font-weight:800;letter-spacing:.02em;color:var(--accent);font-size:1.125rem}

.ico{width:1.05em;height:1.05em;flex:none;vertical-align:-.17em;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .ico{width:15px;height:15px;margin-right:5px;vertical-align:-2px}
.k-MISMATCH .ico{color:var(--bad)}.k-NEEDS_REVIEW .ico{color:var(--rev)}.k-OK .ico{color:var(--ok)}.k-CHECKED .ico{color:var(--mute)}
td .ico{width:.95em;height:.95em;margin-right:5px}
td.diff .ico{color:var(--bad)}td.gap .ico{color:var(--rev)}
.sbox{position:relative;display:flex;align-items:center;flex:1 1 200px;min-width:0;max-width:340px}
.sbox .ico{position:absolute;left:10px;margin:0;color:var(--mute);pointer-events:none}
.bar input[type=search]{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px 6px 32px;font:inherit}
.bar input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.checking{display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spinr .8s linear infinite;display:inline-block;flex:none}
.prog{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:35%;background:var(--accent);border-radius:4px;animation:sweep 1.3s ease-in-out infinite}
.banner.fresh{animation:fresh 1.6s ease-out 1}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.detail.fadein{animation:fadein .25s ease-out 1}
@media (prefers-reduced-motion:reduce){.spin,.prog i,.banner.fresh,.detail.fadein{animation:none}}
.badge{display:inline-block;font-size:0.75rem;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-MISMATCH{background:var(--bad-soft);color:var(--bad)}
.b-NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.b-OK{background:var(--ok-soft);color:var(--ok)}
.b-none,.b-done{background:var(--sunk);color:var(--mute)}
.badge .cnt{display:inline-block;min-width:1.4em;margin-left:6px;padding:0 5px;border-radius:999px;text-align:center;color:var(--panel)}
.b-MISMATCH .cnt{background:var(--bad)}.b-NEEDS_REVIEW .cnt{background:var(--rev)}
.mute{color:var(--mute)}
.small{font-size:0.8125rem}
.num{font-variant-numeric:tabular-nums}
/* status strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:14px;padding:20px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 16px;text-align:left;box-shadow:var(--card)}
.kpi b{display:block;font-size:1.625rem;line-height:1.1}
.kpi{cursor:pointer;transition:background .12s,border-color .12s}
.kpi{position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:repeating-linear-gradient(90deg,var(--stripe) 0 7px,color-mix(in srgb,var(--stripe) 60%,transparent) 7px 9px)}
.kpi.k-MISMATCH{--stripe:var(--bad)}.kpi.k-NEEDS_REVIEW{--stripe:var(--rev)}.kpi.k-OK{--stripe:var(--ok)}.kpi.k-CHECKED{--stripe:var(--mute)}.kpi.k-OTHER{--stripe:var(--accent)}
.kpi:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--card)}
.kpi.k-CHECKED b{color:var(--mute)}.kpi.k-MISMATCH b{color:var(--bad)}.kpi.k-NEEDS_REVIEW b{color:var(--rev)}.kpi.k-OK b{color:var(--ok)}
.bar{display:flex;gap:8px;align-items:center;padding:16px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));flex-wrap:wrap}
.bar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;bottom:0;padding:8px 10px max(8px,env(safe-area-inset-bottom)) 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card);color:var(--mute)}
.pager{margin-top:auto}
.pbtns{display:flex;gap:6px}

.pager button:disabled{opacity:.4;cursor:default}
/* split view */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:20px;padding:18px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.list{display:flex;flex-direction:column;gap:10px;min-width:0;padding:2px 6px 14px}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--card)}
.item{cursor:pointer;transition:background .12s,border-color .12s}
.item:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.item.checked{opacity:.6}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:center}

.item mark{background:rgba(255,138,61,.35);color:inherit;border-radius:3px;padding:0 1px}

.item .ref{display:block;margin-top:2px;font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.02em;color:var(--mute);opacity:.85}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;align-self:start;position:sticky;top:64px;min-width:0;box-shadow:var(--card)}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
.empty .ico{display:block;width:40px;height:40px;margin:0 auto 10px;color:var(--accent);opacity:.8}
.empty b{display:block;color:var(--ink);font-size:1rem;margin-bottom:4px}.empty span{display:block;max-width:34ch;margin:0 auto 14px;line-height:1.45}
.empty .btn{margin:0 4px 6px}
/* detail */
.detail h2{margin:0 0 2px;font-size:1.1875rem;line-height:1.25;overflow-wrap:anywhere}

.tbl tr.src{cursor:pointer}.tbl tr.src:hover td{background:var(--accent-soft)}.tbl tr.src.sel td{background:var(--accent-soft)}.tbl tr.src.sel td.f{color:var(--ink);font-weight:600}
.tbl tr.bad td{background:var(--bad-soft)}.tbl tr.gap td{background:var(--rev-soft)}.tbl tr.bad td.f,.tbl tr.gap td.f{color:var(--ink);font-weight:600}
.tbl tr.src:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.text{position:relative}mark.srcline{background:var(--hl);color:var(--hl-ink);font-weight:600;box-shadow:0 0 0 3px var(--hl);border-left:4px solid var(--accent);border-radius:3px;padding-left:4px;margin-left:-8px}
.tbl .diff{background:var(--bad-soft);font-weight:600}

.linkbtn.how{margin-top:4px;padding-top:0}

.cap{font-size:0.8125rem;color:var(--mute);margin-top:6px}

.tbl.mini{font-size:0.8125rem}.tbl.mini td,.tbl.mini th{padding:6px 10px}
.fix{font-size:0.8125rem;padding:4px 0;color:var(--mute)}.fix b{color:var(--ink);font-weight:600}.fix i{font-style:normal;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:inline-flex;align-items:center;gap:4px;font-size:0.8125rem;border-radius:99px;padding:3px 10px 3px 6px}
.chip .ico{width:1em;height:1em}.c-OK{background:var(--ok-soft);color:var(--ok)}.c-MISMATCH{background:var(--bad-soft);color:var(--bad)}.c-NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.linkbtn{display:block;background:none;border:0;color:var(--accent);padding:6px 0;margin-top:8px;font-weight:600;text-align:left}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.doc{min-width:0}

.tabs{display:flex;gap:4px;padding:8px 14px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 10px;min-height:44px;font-weight:600;color:var(--mute);white-space:nowrap}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.dlgb{padding:20px}.dlgb h3{margin:0 0 6px;font-size:1.0625rem}.dlgb p{margin:0 0 14px}
.hb{display:inline-flex;align-items:center;gap:4px}.hb .ico{margin-right:0}
kbd{display:inline-block;min-width:24px;text-align:center;padding:1px 7px;border:1px solid var(--line);border-bottom-width:3px;border-radius:6px;background:var(--sunk);font:600 13px system-ui,sans-serif}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pillx{font-size:0.8125rem;font-weight:600;border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:3px 11px}
.legend{display:grid;gap:8px}.lg{display:flex;gap:10px;align-items:flex-start;font-size:0.875rem}.lg .badge{flex:none;min-width:112px;text-align:center}
.mockbtns{display:flex;flex-wrap:wrap;gap:8px}.mockbtns .btn{cursor:default}
.fl{display:block;font-weight:600;font-size:0.875rem;margin:14px 0 6px}
.fb input,.fb textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit}
.fb input:focus,.fb textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:6px;flex-wrap:wrap}.segb{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:6px 14px;font-weight:600}
.segb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stars{display:flex;gap:2px}.star{background:none;border:0;font-size:1.75rem;line-height:1;color:var(--mute);padding:0 2px}.star.on{color:var(--accent)}
.err{color:var(--bad);margin-top:6px}
.thanks{text-align:center;padding:20px 8px}.thanks .ico{width:44px;height:44px;color:var(--ok);margin:0 auto 8px;display:block}.thanks b{display:block;font-size:1.125rem}.thanks span{display:block;color:var(--mute);margin:6px auto 16px;max-width:42ch}
.road{display:grid;gap:10px}.rcard{display:flex;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--panel);box-shadow:var(--card)}
.rnum{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center}
.rt{font-weight:600;margin-bottom:2px}.rt .pill{margin-left:8px}
.hb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.langwrap{position:relative;display:inline-block}
.acctwrap{position:relative;display:inline-block}
.avatar{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.75rem;line-height:1}
.mhead{padding:8px 10px;overflow-wrap:anywhere}
.mh{display:flex;align-items:center;gap:6px;padding:8px 10px 4px;font-size:0.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}.mh .ico{width:14px;height:14px}
.mi .ico{width:16px;height:16px}
.langwrap .hb .ico:last-child{width:.9em;height:.9em}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:210px;display:flex;flex-direction:column;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card);z-index:20}
.mi{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:8px;padding:9px 10px;text-align:left;color:var(--ink)}
.mi:hover,.mi:focus-visible{background:var(--accent-soft)}.mi.on{color:var(--accent);font-weight:600}
.mtick{width:16px;flex:none;display:inline-flex}.mtick .ico{margin:0;width:16px;height:16px}
.msep{height:1px;background:var(--line);margin:6px 4px}
.ok{color:var(--ok)}
.nextpage{flex:1;min-height:0}
.home{flex:1;min-height:0}
.hx{max-width:1000px;margin:0 auto;padding:28px 16px 60px}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center}
.hero .kicker{margin:0 0 10px;font-weight:700;font-size:1.125rem;color:var(--accent)}
.hero h1{font-size:2.25rem;line-height:1.1;margin:0 0 12px}.hero .lead{font-size:1.0625rem;line-height:1.5;max-width:52ch;margin:0}
.art{width:300px;height:auto;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.art .hullc{fill:var(--ink)}.art .winc{fill:var(--accent)}.art .cb{opacity:.9}
.art .c-bad{fill:var(--bad)}.art .c-ok{fill:var(--ok)}.art .c-rev{fill:var(--rev)}.art .c-acc{fill:var(--accent)}
.art .sea1{fill:var(--accent-soft)}.art .sea2{fill:color-mix(in srgb,var(--accent) 35%,transparent)}
.hx h2{font-size:1.125rem;margin:32px 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.opt{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--card)}
.opt.main{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--card)}
.opt.off{opacity:.7}
.opt .oi .ico{width:26px;height:26px;color:var(--accent)}
.opt .btn{margin-top:auto}
.ostat{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.how3{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.how3 li{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.how3 .ico{width:22px;height:22px;color:var(--accent);margin-bottom:4px}.how3 span{color:var(--mute);font-size:0.875rem;line-height:1.45}
@media (max-width:659px){.hero{grid-template-columns:1fr}.art{width:100%;max-width:260px;justify-self:center}.hero h1{font-size:1.75rem}}
.brand{cursor:pointer}
.route{display:flex;align-items:center;gap:10px;margin:10px 0 2px;font-weight:600;font-size:0.8125rem;letter-spacing:.02em}
.route span{overflow-wrap:anywhere}
.route .lane{flex:1;min-width:40px;max-width:200px;position:relative;height:18px;display:flex;justify-content:center;align-items:center}
.route .lane::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px dashed color-mix(in srgb,var(--accent) 60%,transparent)}
.route .lane .ico{position:relative;background:var(--panel);color:var(--accent);width:18px;height:18px;padding:0 4px;box-sizing:content-box;margin:0}
.nx{max-width:900px;margin:0 auto;padding:24px 16px 60px}
.nx h1{font-size:1.875rem;line-height:1.15;margin:18px 0 6px}.nx h2{font-size:1.125rem;margin:28px 0 12px}.nx .lead{font-size:1rem;margin:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tcard{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--card)}
.tcard .ico{flex:none;width:20px;height:20px;color:var(--ok);margin:1px 0 0}
.cta{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:28px;padding:16px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--card)}
.cta .btn{margin-left:auto}
@media (min-width:660px) and (min-height:600px){.nextpage,.home{overflow-y:auto}}
@media (max-width:560px){.hb .lbl{display:none}}
.dlg ol{padding-left:20px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
@media (min-width:660px) and (min-height:600px){
  html,body{height:100%}
  body{overflow:hidden}
  .top,.kpis,.bar,.split{padding-left:24px;padding-right:24px}
  #app{height:100%;display:flex;flex-direction:column}
  .split{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);padding-bottom:14px}
  .list,.pane{overflow-y:auto;min-height:0}
  .pane{position:static;align-self:stretch}
  .split{grid-template-columns:clamp(240px,var(--listw,380px),46vw) 14px minmax(0,1fr);gap:0}
  .resizer{cursor:col-resize;touch-action:none;position:relative;user-select:none}
  .resizer::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;border-radius:2px;background:var(--line);transition:background .12s}
  .resizer:hover::after,.resizer.drag::after{background:var(--accent)}
  body.resizing{cursor:col-resize;user-select:none}
}
@media (max-width:659px), (max-height:599px){
  .kpi{padding:8px 10px}
  .kpi b{font-size:1.375rem}
  .split{grid-template-columns:1fr}
  .list{min-height:60dvh}
  .resizer{display:none}
  .pane{position:static}
  .split.hasSel .list{display:none}
  .split:not(.hasSel) .pane{display:none}
  .docs{grid-template-columns:1fr}
}

/* Windows high contrast replaces every author colour. Without this the cards,
   the selected row and the status badges all lose their edges and the screen
   becomes one undifferentiated block of text. */
@media (forced-colors: active){
  .kpi,.pane,.item,.tblwrap,.dlg,.pager,.menu{border:1px solid CanvasText}
  .kpi.on,.item.sel,.tbl tr.src.sel td{outline:2px solid Highlight;outline-offset:-2px}
  .badge,.pill,.chip{border:1px solid CanvasText;forced-color-adjust:none}
  .btn{border:1px solid ButtonText}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="results.js"></script>
<script src="i18n.js"></script>
<script type="module">
  // Loaded from a CDN because this page has no build step. Only the auth and
  // REST helpers are used; the page still renders if this never arrives.
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  window.supabase = { createClient };
</script>
<script src="store.js"></script>
<script>
const API_BASE = (window.BLOCKERIS_API_BASE || "").replace(/\/$/, "");
const PAGE = 30;
const T = s=>s;   // marks a string that has translations, translated where it is shown with t()

/* ---- languages: English is the text in this file, Malay and Chinese come from i18n.js ---- */
const LANGS = {en:{name:"English", english:"English"}, ms:{name:"Bahasa Malaysia", english:"Malay"}, zh:{name:"\u4e2d\u6587", english:"Simplified Chinese"}};
const BUILTIN = window.I18N || {};
const allLangs = ()=>Object.entries(LANGS).map(([code,l])=>({code,...l}));
function pickLang(){
  let saved = null; try{ saved = localStorage.getItem("blockeris.lang"); }catch(_){}
  if(saved && LANGS[saved]) return saved;
  const n = (navigator.language||"en").toLowerCase();
  return n.startsWith("ms") ? "ms" : n.startsWith("zh") ? "zh" : "en";
}
let LANG = pickLang();
document.documentElement.lang = LANG;
function t(key, vars){
  const table = LANG==="en" ? null : BUILTIN[LANG];
  const s = (table && typeof table[key]==="string" && table[key]) || key;
  return vars ? s.replace(/\{(\w+)\}/g, (m,k)=>k in vars ? vars[k] : m) : s;
}
function setLang(code){
  LANG = code; document.documentElement.lang = code;
  try{ localStorage.setItem("blockeris.lang", code); }catch(_){}
}

const FIELDS = {shipper:T("Shipper"),consignee:T("Consignee"),notify_party:T("Notify party"),port_of_loading:T("Port of loading"),port_of_discharge:T("Port of discharge"),container_count:T("Containers"),gross_weight_kg:T("Gross weight")};
const fld = f=>t(FIELDS[f]);
const REASON = {
  missing_value:T("A field is blank in one of the two documents."),
  unreadable:T("One attachment could not be read (scanned or cut off)."),
  wrong_doc_type:T("One attachment is not a Shipping Instruction or a Bill of Lading."),
  missing_attachment:T("The SI or the BL is not attached to this email.")};
const LABEL = {MISMATCH:T("Action required"), NEEDS_REVIEW:T("Needs review"), OK:T("Verified")};
const OTHER = {SI_REQUEST:T("SI request"), INVOICE_QUERY:T("Invoice"), GENERAL:T("General"), SPAM:T("Spam"), BL_COMPARISON:T("SI vs BL")};
const FOLDERS = [
  {k:"MISMATCH", n:T("Action required"), f:e=>e.status==="MISMATCH" && !S.marks[e.id]},
  {k:"NEEDS_REVIEW", n:T("Needs review"), f:e=>e.status==="NEEDS_REVIEW" && !e.awaiting && !S.marks[e.id]},
  {k:"OK", n:T("Verified"), f:e=>e.status==="OK"},
  {k:"CHECKED", n:T("Done"), f:e=>!!S.marks[e.id]},
  {k:"OTHER", n:T("Other mail"), f:e=>!e.status || !!e.awaiting},
  {k:"AWAIT", n:T("Draft BL requests"), f:e=>!!e.awaiting},
  {k:"SI_REQUEST", n:T("SI requests"), f:e=>e.category==="SI_REQUEST"},
  {k:"INVOICE_QUERY", n:T("Invoice queries"), f:e=>e.category==="INVOICE_QUERY"},
  {k:"GENERAL", n:T("General"), f:e=>e.category==="GENERAL"},
  {k:"SPAM", n:T("Spam"), f:e=>e.category==="SPAM"},
];
const RANKED = ["MISMATCH","NEEDS_REVIEW"];
/* The main button names the next step; draftFor() already writes the reply for each case. */
const NEXT_STEP = {
  MISMATCH:T("Ask to fix the BL"),
  missing_value:T("Ask for the missing values"),
  unreadable:T("Ask for a clearer file"),
  missing_attachment:T("Ask for the SI and BL"),
  wrong_doc_type:T("Ask for the right documents")
};
/* The emails a person has to act on; the progress line counts how many are done. */
const todo = e=>(e.status==="MISMATCH"||e.status==="NEEDS_REVIEW") && !e.awaiting;
/* Other mail is everything that is not a check result; its types are chips inside it. */
const OTHER_KINDS = ["AWAIT","SI_REQUEST","INVOICE_QUERY","GENERAL","SPAM"];
const SUPPORT_EMAIL = (window.BLOCKERIS_SUPPORT_EMAIL || "").trim();
const KINDS = {question:T("Question"), problem:T("Problem"), idea:T("Idea")};
const ROADMAP = [
  [T("Connect a real mailbox"), T("Sign in with Outlook, Gmail or any IMAP mailbox (OAuth) so new emails arrive on their own, instead of the saved dataset.")],
  [T("Send replies from this page"), T("Send is a demo today. Next, the reply goes out from your own mailbox, with a copy kept in the thread.")],
  [T("A second AI that double checks"), T("A critic agent scores how sure it is about each extracted field. Low scores are retried, then sent to a person.")],
  [T("Read scanned and cut-off files"), T("Scanned PDFs are sent to review today. OCR would read most of them, so fewer emails need a person.")],
  [T("Shared review queue for a team"), T("Several reviewers work the same queue, with who checked what and when.")],
  [T("Translate an email"), T("Translate an email and its documents into the reviewer's language with one click, for people who do not read English.")],
  [T("Add more languages"), T("Load a language pack file, or let the AI translate the page into any language you choose.")],
  [T("Colour-blind friendly themes"), T("Extra colour themes for people with colour blindness, so Action required, Needs review and Verified can be told apart without relying on red and green.")]
];
function feedbackText(){
  const f = S.fb;
  return `${KINDS[f.kind]}${S.sel?" about email "+S.sel.replace("email_","#"):""}\n\n${f.msg.trim()}\n\n${f.rating?"Rating: "+f.rating+" out of 5\n":""}${f.from.trim()?"Reply to: "+f.from.trim():""}`.trim();
}
function loadFeedback(){ try{ return JSON.parse(localStorage.getItem("blockeris.feedback")||"[]"); }catch(_){ return []; } }
function saveFeedback(list){ try{ localStorage.setItem("blockeris.feedback", JSON.stringify(list)); }catch(_){} }
const kbd = t=>`<kbd>${t}</kbd>`;

function guideHTML(){
  const pills = [T("Action required"),T("Needs review"),T("Verified"),T("Done"),T("Other mail")].map(n=>`<span class="pillx">${t(n)}</span>`).join("");
  const legend = [
    ["MISMATCH",T("Action required"),T("The Shipping Instruction and the Bill of Lading disagree. The different field is marked. Fix the Bill of Lading.")],
    ["NEEDS_REVIEW",T("Needs review"),T("A person needs to look. The reason is under the banner (blank field, unreadable file, wrong document).")],
    ["OK",T("Verified"),T("All 7 fields match. Nothing to do.")]
  ].map(([k,n,d])=>`<div class="lg"><span class="badge b-${k}">${ICON[k]}${t(n)}</span><span>${t(d)}</span></div>`).join("");
  return `<ol class="steps">` +
    step(1,t("Pick a folder"),`<div class="pills">${pills}</div><div class="cap">${t("The boxes at the top filter the list. Other mail holds draft BL requests, SI requests, invoices, general mail and spam.")}</div>`) +
    step(2,t("Open an email"),`<div class="cap">${t("Click one in the list. Search by subject, sender or number, and press {esc} to clear it. Once an email is open, {left} {right} move to the previous or next email. On a phone, List takes you back.",{esc:kbd("Esc"),left:kbd("←"),right:kbd("→")})}</div>`) +
    step(3,t("Read the colour"),`<div class="legend">${legend}</div>`) +
    step(4,t("Check the details"),`<div class="cap">${t("Click a row in the table to highlight where that value sits in the original documents. Open {how} to see every step, from the cover email to the field by field check.",{how:"<b>"+t("How Ship Happens decided")+"</b>"})}</div>`) +
    step(5,t("Finish"),`<div class="mockbtns"><span class="btn">${t("Mark as done")}</span><span class="btn alt">${t("Reply to sender")}</span></div><div class="cap">${t("{reply} writes a draft for you to edit. Sending is a demo for now: use Copy or Open in your email app. Wrong click? Press Undo.",{reply:"<b>"+t("Reply to sender")+"</b>"})}</div>`) +
    `</ol>`;
}

function supportHTML(){
  const f = S.fb;
  if(f.sent) return `<div class="thanks">${ICON.OK}<b>${t("Thank you, we got it.")}</b><span>${f.sent==="mailto"?t("Your email app should have opened with the message ready to send."):t("It is saved on this device. Email to the support team is not switched on in this demo yet, so it has not been sent.")}</span><button class="btn alt" data-a="fbagain">${t("Write another")}</button></div>`;
  const about = S.sel ? `<div class="small mute">${t("This note will mention email {id}.",{id:esc(S.sel.replace("email_","#"))})}</div>` : "";
  const kinds = Object.entries(KINDS).map(([k,n])=>`<button class="segb ${f.kind===k?"on":""}" data-a="kind" data-k="${k}" aria-pressed="${f.kind===k}">${t(n)}</button>`).join("");
  const stars = [1,2,3,4,5].map(n=>`<button class="star ${f.rating>=n?"on":""}" data-a="rate" data-k="${n}" aria-label="${t("{n} out of 5",{n})}">${f.rating>=n?"★":"☆"}</button>`).join("");
  return `<div class="fb"><h3>${t("Need a hand?")}</h3><p class="mute small">${t("Ask the support team a question, report a problem or share an idea. Every note helps us improve the next version.")}</p>
    <div class="fl">${t("What is it about?")}</div><div class="seg">${kinds}</div>
    <label class="fl" for="fb-msg">${t("Your message")}</label><textarea id="fb-msg" data-fb="msg" rows="5" placeholder="${t("Tell us what happened or what you would like")}">${esc(f.msg)}</textarea>
    ${f.err?`<div class="err small">${t("Please write a short message first.")}</div>`:""}
    <label class="fl" for="fb-from">${t("Your email, if you want a reply (optional)")}</label><input id="fb-from" data-fb="from" type="email" value="${esc(f.from)}" placeholder="name@example.com">
    <div class="fl">${t("How is Ship Happens working for you?")}</div><div class="stars">${stars}</div>
    ${about}
    <div class="actions"><button class="btn" data-a="fbsend">${SUPPORT_EMAIL?t("Send to support"):t("Send feedback")}</button><button class="btn alt" data-a="fbcopy">${f.copied?t("Copied"):t("Copy message")}</button></div></div>`;
}

const TODAY = [
  T("Sorts every email into one of five types with AI"),
  T("Reads the SI and the draft BL from text, Word, Excel and PDF files"),
  T("Pulls the 7 fields out of each document with AI"),
  T("Compares the fields with plain rules, so every result can be explained"),
  T("Sends unclear cases to a review queue with the reason"),
  T("Writes a draft reply for the sender (sending is a demo)"),
  T("Translates the page into English, Malay and Chinese")
];
/* A container ship in the status colours, drawn in the logo's style. Decoration only. */
const SHIP_ART = (()=>{
  const box = (x,y,c)=>`<rect class="cb ${c}" x="${x}" y="${y}" width="36" height="20" rx="2"/><rect x="${x}" y="${y}" width="36" height="20" rx="2" fill="url(#corr)"/>`;
  const low = [[40,"c-bad"],[78,"c-ok"],[116,"c-rev"],[154,"c-acc"]].map(([x,c])=>box(x,84,c)).join("");
  const high = [[59,"c-ok"],[97,"c-acc"],[135,"c-bad"]].map(([x,c])=>box(x,62,c)).join("");
  return `<svg class="art" viewBox="0 40 260 130" aria-hidden="true"><defs><pattern id="corr" width="6" height="20" patternUnits="userSpaceOnUse"><path d="M3 0v20" stroke="rgba(255,255,255,.4)" stroke-width="1.2"/></pattern></defs>${high}${low}<rect class="hullc" x="192" y="60" width="30" height="44" rx="3"/><rect class="winc" x="197" y="67" width="20" height="6" rx="1"/><rect class="winc" x="205" y="46" width="8" height="14" rx="1"/><path class="hullc" d="M24 104H236L216 138H44Z"/><path class="sea1" d="M0 142q16-8 32 0t32 0t32 0t32 0t32 0t32 0t32 0t32 0t32 0V170H0Z"/><path class="sea2" d="M0 152q16-7 32 0t32 0t32 0t32 0t32 0t32 0t32 0t32 0t32 0V170H0Z"/></svg>`;
})();

/* The first step: choose where the mail comes from. Shown on every visit; the inbox lives at #/inbox. */
function homePage(){
  const u = S.user, name = u ? ((u.user_metadata||{}).full_name || u.email || "") : "";
  const gmail = u ? `<div class="small mute">${t("Signed in as {name}. Your mailbox appears here in the next update.",{name:esc(name)})}</div>`
    : `<button class="btn alt" data-a="signin" ${S.authReady?"":"disabled"}>${t("Sign in with Google")}</button>`;
  const stat = k=>`<span class="badge b-${k}">${ICON[k]}${count(k)} ${t(LABEL[k])}</span>`;
  const how = [[ICON.MAIL,T("Emails arrive"),T("Each one is sorted into one of five types.")],
               [ICON.SHIP,T("Seven fields compared"),T("Shipper, consignee, notify party, both ports, containers and weight.")],

const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const folder = k=>FOLDERS.find(x=>x.k===k);
const count = k=>RESULTS.filter(folder(k).f).length;
const items = ()=>{
  const term = S.q.trim().toLowerCase().replace(/^#/,"");
  // an email you just marked stays in the list until you open another one, so the list does not jump under you
  const stays = e=>e.id===S.sel && S.marks[e.id] && e.status===S.f;
  // a search looks through all mail, so nothing is hidden behind the folder you happen to be in
  const inView = term ? ()=>true : e=>folder(S.f).f(e) || stays(e);
  const found = RESULTS.filter(inView).filter(e=>!term || (e.subject+" "+e.from+" "+e.id.replace("email_","")+" "+(e.ref||"")).toLowerCase().includes(term));
  // Most issues puts the most fields to fix on top; sort is stable, so ties keep the saved order.
  // Most recent is the saved inbox order (the demo data has no dates; a live mailbox brings them).
  if(term || !RANKED.includes(S.f)) return found;
  if(S.sort==="worst") return found.sort((a,b)=>issues(b)-issues(a));
  if(S.sort==="least") return found.sort((a,b)=>issues(a)-issues(b));
  return S.sort==="old" ? found.reverse() : found;
};
const who = e=>esc(e.from.replace(/<.*>/,"").trim()||e.from);
/* Search highlight: wrap each match in <mark>. Every piece is escaped, so an email cannot inject HTML. */
const hl = s=>{
  s = String(s??""); const t = S.q.trim().replace(/^#/,"");
  if(!t) return esc(s);
  const lo = s.toLowerCase(), tl = t.toLowerCase(); let out = "", i = 0, j;
  while((j = lo.indexOf(tl,i)) >= 0){ out += esc(s.slice(i,j)) + "<mark>" + esc(s.slice(j,j+t.length)) + "</mark>"; i = j + t.length; }
  return out + esc(s.slice(i));
};

/* find the lines of the original text that hold a field's value: a "Label: value" line first, then any line containing it */
function sourceLines(text, raw){
  if(!raw) return null;
  const lines = text.split("\n");
  let at = lines.findIndex(l=>{ const i=l.indexOf(":"); return i>0 && l.slice(i+1).trim().startsWith(raw); });
  if(at<0) at = lines.findIndex(l=>l.includes(raw));
  if(at<0) return null;
  let end = at;
  while(end+1<lines.length && /^\s+\S/.test(lines[end+1])) end++;   // indented lines continue the value (addresses)
  return [at, end];
}
function textHTML(text, span){
  if(!span) return esc(text);
  const lines = text.split("\n");
  return esc(lines.slice(0,span[0]).join("\n")) + (span[0]?"\n":"") +
    `<mark class="srcline">${esc(lines.slice(span[0],span[1]+1).join("\n"))}</mark>` +
    (span[1]<lines.length-1?"\n":"") + esc(lines.slice(span[1]+1).join("\n"));
}
function docsHTML(e, rows){
  const row = S.hl ? rows.find(r=>r.field===S.hl) : null;
  const box = (role,name)=>{

    const body = !d ? t("Not attached to this email.") : d.text ? textHTML(d.text, row?sourceLines(d.text, raw):null) : t("This file could not be read.");
    return `<div class="doc"><div class="doch">${name}${d?` (${esc(d.name)})`:""}</div><div class="text">${body}</div></div>`;
  };

  return `<button class="linkbtn" data-a="docs">${S.docs?"▾":"▸"} ${t("Original documents")}</button>` + (S.docs?note+`<div class="docs">${box("SI",t("Shipping Instruction"))}${box("BL",t("Draft Bill of Lading"))}</div>`:"");
}

const line = r=>`- ${FIELDS[r.field]}: the SI says ${r.si_raw||"(blank)"}, the draft BL says ${r.bl_raw||"(blank)"}`;
function draftFor(e){
  const rows = e.rows||[];
  let ask;
  if(e.status==="MISMATCH"){
    ask = `I checked the draft Bill of Lading against the Shipping Instruction and found ${e.defect_fields.length===1?"a difference":"these differences"}:\n\n${rows.filter(r=>r.verdict==="mismatch").map(line).join("\n")}\n\nCould you please amend the draft BL and send it again for checking?`;
  } else if(e.review_reason==="missing_value"){
    ask = `I could not complete the check because a value is blank in one of the documents:\n\n${rows.filter(r=>r.verdict==="missing").map(line).join("\n")}\n\nCould you please confirm the missing values and send the updated document?`;
  } else if(e.review_reason==="missing_attachment"){
    const have = Object.keys(e.docs||{});
    const need = ["SI","BL"].filter(r=>!have.includes(r)).map(r=>r==="SI"?"Shipping Instruction":"draft Bill of Lading");
    ask = `I could not find the ${need.join(" and ")||"documents"} attached to your email. Could you please send both the Shipping Instruction and the draft Bill of Lading so I can check them?`;
  } else if(e.review_reason==="unreadable"){
    ask = "One of the attached files could not be opened (it may be a scan or cut off). Could you please resend it as a text-based PDF, Word or Excel file?";
  } else if(e.review_reason==="wrong_doc_type"){
    ask = "One of the attached files does not look like a Shipping Instruction or a draft Bill of Lading. Could you please send the correct documents?";
  } else {
    ask = "Could you please check the documents and send them again?";
  }
  return {id:e.id, to:e.from, subject:/^re[:_]/i.test(e.subject)?e.subject:"RE: "+e.subject,
          body:`Hi,\n\nThank you for your email. ${ask}\n\nThank you.\nBest regards,\n`};
}

function step(n, title, evidence){
  return `<li class="step"><span class="num">${n}</span><div><div class="st">${title}</div>${evidence||""}</div></li>`;
}
const cut = (t,n)=>t.length>n ? t.slice(0,n).replace(/\s+\S*$/,"")+"…" : t;

function how(e){
  const cat = esc(e.category==="BL_COMPARISON" ? t("SI vs BL") : (OTHER[e.category]?t(OTHER[e.category]):e.category).toLowerCase());
  const ai = e.decided_by!=="fallback";
  const pct = typeof e.class_confidence==="number" ? `<span class="pill">${t("{n}% sure",{n:Math.round(e.class_confidence*100)})}</span>` : "";
  const steps = [step(1, ai ? `${t("The AI read the cover email and filed it under {cat}",{cat:"<b>"+cat+"</b>"})} ${pct}` : t("A keyword rule read the cover email and filed it under {cat}",{cat:"<b>"+cat+"</b>"}),
    `<blockquote>${esc(cut(e.body.replace(/\s+/g," ").trim(),240))}</blockquote>` +
    (ai && e.class_evidence ? `<div class="cap">${t("AI reason:")} ${esc(e.class_evidence)}</div>` : ai ? "" : `<div class="cap">${t("Not the AI. A simple rule on the subject and text.")}</div>`))];
  if(e.category!=="BL_COMPARISON"){
    steps.push(step(2, t("Stopped here"), `<div class="cap">${t("Only SI vs BL emails are compared, so nothing else was run.")}</div>`));
  } else {
    const docs = e.docs ? ["SI","BL"].filter(r=>e.docs[r]).map(r=>e.docs[r]) : [];
    steps.push(step(2, docs.length ? t(docs.length>1?T("Opened {n} attached files"):T("Opened {n} attached file"),{n:docs.length}) : t("Looked for the SI and the draft BL"),
      docs.length ? `<div class="files">${docs.map(d=>`<div class="file"><b>${esc(d.name)}</b><span>${esc(d.title||t("no title found"))} · ${t("{n} label/value pairs",{n:d.pairs.length})}${d.parse_status&&d.parse_status!=="ok"?` · ${esc(d.parse_status)}`:""}</span></div>`).join("")}</div>`
        : `<div class="cap">${t("Nothing readable is attached.")}</div>`));
    const rows = e.rows||[];
    if(!rows.length){
      steps.push(step(3, t("Could not go further"), `<div class="cap">${esc(REASON[e.review_reason]?t(REASON[e.review_reason]):t("A person needs to look."))}</div>`));
    } else {
      steps.push(step(3, t("The AI read the 7 fields from each document"), `<div class="tblwrap"><table class="tbl mini"><thead><tr><th>${t("Field")}</th><th>${t("SI says")}</th><th>${t("BL says")}</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="f">${fld(r.field)}</td><td>${esc(r.si_raw)||t("(blank)")}</td><td>${esc(r.bl_raw)||t("(blank)")}</td></tr>`).join("")}</tbody></table></div><div class="cap">${t("Each value has to appear word for word in the document, or it is dropped.")}</div>`));
      const fixes = rows.flatMap(r=>[["SI",r.si_raw,r.si_norm],["BL",r.bl_raw,r.bl_norm]].filter(x=>(x[1]||"")!==(x[2]||"")).map(x=>`<div class="fix"><b>${fld(r.field)} (${x[0]})</b> ${esc(x[1])} <i>→</i> ${esc(x[2])||t("(blank)")}</div>`));
      steps.push(step(4, t("Cleaned the values"), fixes.length ? fixes.join("") : `<div class="cap">${t("Nothing needed cleaning.")}</div>`));
      const V = {match:["OK","Match"], mismatch:["MISMATCH","Differs"], missing:["NEEDS_REVIEW","Missing"]};
      steps.push(step(5, e.status==="OK" ? t("Compared field by field: all match") : t("Compared field by field: {n} differ",{n:(e.defect_fields||[]).length}),
        `<div class="chips">${rows.map(r=>`<span class="chip c-${V[r.verdict][0]}">${ICON[V[r.verdict][0]]}${fld(r.field)}</span>`).join("")}</div>`));
    }
  }
  const open = S.how;
  return `<button class="linkbtn how" data-a="how">${open?"▾":"▸"} ${t("How Ship Happens decided")}</button>` +
    (open ? `<ol class="steps">${steps.join("")}</ol>` : "");
}

function detail(e){
  const live = S.live[e.id];
  const view = live && live.result ? {...e, ...live.result} : e;
  const fresh = live && live.fresh ? "fresh" : "";
  let h = `<div class="detail"><h2>${esc(e.subject)}</h2><div class="mute small">${who(e)} · ${e.id.replace("email_","#")}</div>${routeHTML(e)}${how(e)}`;
  let banner, tbl = "";
  if(e.awaiting){
    banner = `<div class="banner plain">${t("Draft BL requested")}<span>${t("The sender asked for the draft BL and nothing is attached, so there is nothing to compare yet.")}</span></div>`;
  } else if(view.status==="MISMATCH"){
    const n = view.defect_fields.length;
    banner = `<div class="banner MISMATCH ${fresh}">${ICON.MISMATCH}${t(n>1?T("{n} fields differ"):T("{n} field differs"),{n})}<span>${t("Fix the Bill of Lading before it is released.")}</span></div>`;
    tbl = table(view.rows);
  } else if(view.status==="NEEDS_REVIEW"){
    banner = `<div class="banner NEEDS_REVIEW ${fresh}">${ICON.NEEDS_REVIEW}${t("Needs a person to look")}<span>${REASON[view.review_reason]?t(REASON[view.review_reason]):""}</span></div>`;
    if(view.rows.length) tbl = table(view.rows);
  } else if(view.status==="OK"){
    banner = `<div class="banner OK ${fresh}">${ICON.OK}${t("All 7 fields match")}<span>${t("Nothing to do.")}</span></div>`;
    tbl = table(view.rows);
  } else {
    banner = `<div class="banner plain">${t("Not an SI vs BL check")}<span>${t(e.decided_by==="fallback"?T("Filed under {cat} by a simple keyword rule, not the AI."):T("Filed under {cat}."),{cat:esc((OTHER[e.category]?t(OTHER[e.category]):e.category).toLowerCase())})}</span></div>`;
  }
  h += banner + actionsHTML(e) + tbl;
  if(e.docs) h += docsHTML(e, view.rows||[]);
  h += `<button class="linkbtn" data-a="body">${S.body?"▾":"▸"} ${t("Cover email")}</button>` + (S.body?`<div class="text">${esc(e.body)}</div>`:"");
  h += `<button class="linkbtn report" data-a="report">${ICON.FLAG}${t("Report a problem with this result")}</button>`;
  if(canRecheck(e)){
    h += `<div class="live" aria-live="polite">${live&&live.busy
      ? `<div class="checking"><span class="spin"></span><span>${t("Checking with the AI")}<span class="mute"> \u00b7 <span id="elapsed">${Math.floor((Date.now()-live.t0)/1000)}</span>s</span></span></div><div class="prog"><i></i></div><div class="mute small">${t("The first check can take up to a minute while the server wakes up.")}</div>`
      : `${live&&live.result?"":`<span class="mute small">${t("Showing the saved AI result.")} </span>`}<button class="ghost" data-a="recheck" data-id="${e.id}">${t("Check again with AI")}</button>`}`;
    if(live&&live.note) h += ` <span class="${live.error?"":"mute"}">${esc(live.note)}</span>`;
    h += `</div>`;
  }
  return h + "</div>";
}

async function recheck(id){
  const e = byId[id];
  S.live[id] = {busy:true, t0:Date.now()}; render();
  const tick = setInterval(()=>{ const el=document.getElementById("elapsed"); if(el) el.textContent=Math.floor((Date.now()-S.live[id].t0)/1000); }, 1000);
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 90000);
  try{
    const res = await fetch(API_BASE+"/process-email?live=true", {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctrl.signal,
      /* attachments must be sent: EmailInput defaults the field to [], and the
         router locates the SI and BL by walking that list. Omit it and every
         email resolves to no files and comes back NEEDS_REVIEW. Bare file
         names are fine - resolve_attachment_path looks them up under
         data/attachments/. */
      body:JSON.stringify({email_id:id, from:e.from, subject:e.subject, body:e.body,
        attachments:[e.docs.SI.name, e.docs.BL.name].filter(Boolean)})});
    if(!res.ok) throw new Error("HTTP "+res.status);
    /* One call runs all five stages; the page only redraws the verdict. */
    const result = (await res.json()).ComparisonResult;
    if(!result) throw new Error("no ComparisonResult");
    const same = result.status===e.status && JSON.stringify(result.defect_fields)===JSON.stringify(e.defect_fields);
    S.live[id] = {result, fresh:true, note: t(same?T("Live AI check done. Same result as the saved one."):T("Live AI check done. It differs from the saved result, so please look closely."))};
  }catch(err){
    S.live[id] = {error:true, note:t("Could not reach the AI service, so this shows the saved result. Try again in a moment.")};
  }finally{ clearTimeout(timer); clearInterval(tick); render(); if(S.live[id]) S.live[id].fresh=false; }
}

/* KPI numbers count up from zero once, when the page first opens */
function countUp(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const tiles = [...document.querySelectorAll(".kpi .num")], end = tiles.map(t=>+t.textContent), t0 = performance.now(), ms = 700;
  const tick = now=>{
    const p = Math.min(1, (now-t0)/ms), ease = 1-Math.pow(1-p,3);
    tiles.forEach((t,i)=>{ if(t.isConnected) t.textContent = Math.round(end[i]*ease); });
    if(p<1) requestAnimationFrame(tick);
  };
  tiles.forEach(t=>{ t.textContent = 0; });
  requestAnimationFrame(tick);
}

/* drag the divider between list and detail (desktop only; the handle is hidden on mobile) */
try{ const w=localStorage.getItem("listw"); if(w) document.documentElement.style.setProperty("--listw", w+"px"); }catch(e){}
document.addEventListener("pointerdown", ev=>{
  const h = ev.target.closest && ev.target.closest(".resizer");
  if(!h || ev.button) return;
  ev.preventDefault();
  const split = h.parentElement, left = split.getBoundingClientRect().left;
  let w = 0;
  h.classList.add("drag"); document.body.classList.add("resizing");
  const move = e=>{
    const max = split.clientWidth - 14 - 360;
    w = Math.max(240, Math.min(max, e.clientX - left));
    document.documentElement.style.setProperty("--listw", w+"px");
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
    h.classList.remove("drag"); document.body.classList.remove("resizing");
    try{ if(w) localStorage.setItem("listw", Math.round(w)); }catch(e){}
  };
  document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
});

  else if(a==="draft"){ S.draft = draftFor(byId[id]); S.copied=null; S.scrollTo=".reply"; }
  else if(a==="discard"){ S.draft=null; }
  else if(a==="send"){ S.sent[id]={to:S.draft.to, subject:S.draft.subject, body:S.draft.body}; S.marks[id]="back"; S.draft=null; saveSent(); saveMarks(); Store?.pushReply(id, S.sent[id]); advance(id); }
  else if(a==="copy"){ try{ navigator.clipboard.writeText(S.draft.body); S.copied=S.draft.id; }catch(_){} }
  else if(a==="mailto"){ location.href = "mailto:"+encodeURIComponent(S.draft.to)+"?subject="+encodeURIComponent(S.draft.subject)+"&body="+encodeURIComponent(S.draft.body); return; }
  else if(a==="recheck") return recheck(id);
  render();
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="q"){ S.q=ev.target.value; S.page=0; S.resetList=true; if(ONE_PANE.matches){ S.sel=null; S.resetPane=true; } render(); return; }
  const fbf = ev.target.dataset.fb;
  if(fbf){ S.fb[fbf]=ev.target.value; S.fb.err=false; S.fb.copied=false; return; }   // no redraw while typing
  const f = ev.target.dataset.f;
  if(f && S.draft) S.draft[f] = ev.target.value;   // no redraw while typing, or the cursor would jump
});
document.addEventListener("change", ev=>{
  const a = ev.target.dataset.a;
  if(a==="sortsel"){ S.sort=ev.target.value; S.page=0; S.resetList=true; render(); }
  if(a==="kindsel"){ S.f=ev.target.value; S.page=0; S.sel=null; S.resetList=true; S.resetPane=true; render(); }

});
/* After Done or Send, open the next email in this folder so the reviewer keeps going. The Undo box
   leaves with the email, so Undo moves to a bar at the bottom for a few seconds. */
let toastTimer = null;
function advance(id){
  const list = items(), at = list.findIndex(e=>e.id===id), rest = list.filter(e=>e.id!==id);
  const next = rest[at] || (RANKED.includes(S.f) ? rest[0] : null);
  S.toast = {id, kind:S.marks[id]};
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ S.toast=null; render(); }, 6000);
  S.draft=null; S.hl=null; S.docs=true; S.body=false; S.how=false; S.resetPane=true; S.fade=true;
  if(!next){ S.sel=null; return; }
  S.sel=next.id; S.keyNav=true; S.page=Math.max(0,Math.floor(items().findIndex(e=>e.id===next.id)/PAGE));
}
const toastHTML = ()=>S.toast ? `<div class="toast" role="status"><span>${S.toast.kind==="ok"?t("Marked as done"):t("Reply sent (demo)")}</span><button class="ghost" data-a="undo" data-id="${S.toast.id}">${t("Undo")}</button></div>` : "";
/* Language and colour mode share one menu, so the top bar keeps only Help, What's next and the account. */
function settingsHTML(isDark){
  const lang = allLangs().map(l=>`<button class="mi ${l.code===LANG?"on":""}" role="menuitemradio" aria-checked="${l.code===LANG}" data-a="langpick" data-k="${l.code}"><span class="mtick">${l.code===LANG?ICON.CHECKED:""}</span>${esc(l.name)}</button>`).join("");
  const mode = [["light",T("Light Mode"),ICON.SUN,!isDark],["dark",T("Dark Mode"),ICON.MOON,isDark]].map(([k,n,ico,on])=>`<button class="mi ${on?"on":""}" role="menuitemradio" aria-checked="${on}" data-a="theme" data-k="${k}"><span class="mtick">${on?ICON.CHECKED:""}</span>${ico}${t(n)}</button>`).join("");
  return `<div class="menu" role="menu" aria-label="${t("Settings")}"><div class="mh">${ICON.GLOBE}${t("Language")}</div>${lang}<button class="mi" data-a="langmore"><span class="mtick"></span>${t("Get more languages...")}</button><div class="msep"></div><div class="mh">${ICON.SUN}${t("Colour mode")}</div>${mode}</div>`;
}
/* Labelled dropdowns, the usual pattern for sorting and filtering a list. */
const pick = (a,label,opts,cur)=>`<label class="pick mute small">${label}<select data-a="${a}">${opts.map(([v,n])=>`<option value="${v}" ${v===cur?"selected":""}>${n}</option>`).join("")}</select></label>`;
function kindsHTML(){
  return pick("kindsel", t("Type"), ["OTHER",...OTHER_KINDS].map(k=>[k, `${k==="OTHER"?t("All"):t(folder(k).n)} (${count(k)})`]), S.f);
}
function sortHTML(){
  return pick("sortsel", t("Sort by"), [["worst",T("Most issues")],["least",T("Fewest issues")],["new",T("Most recent")],["old",T("Oldest")]].map(([v,n])=>[v,t(n)]), S.sort);
}
function tallyHTML(){
  const work = RESULTS.filter(todo), total = work.length, done = work.filter(e=>S.marks[e.id]).length;
  return `<span class="tally small" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><span class="num">${t("{done} of {total} done",{done,total})}</span><i style="--p:${total?Math.round(done*100/total):0}%"></i></span>`;
}
function allDoneHTML(){
  const other = S.f==="MISMATCH" ? "NEEDS_REVIEW" : "MISMATCH";
  return `<div class="empty">${ICON.OK}<b>${t("All done in this folder")}</b><span>${t("Every email here is marked as done or replied.")}</span>${count(other)?`<button class="btn" data-a="folder" data-k="${other}">${t(other==="NEEDS_REVIEW"?T("Go to Needs review"):T("Go to Action required"))}</button>`:""}</div>`;
}

function goTo(e){
  const at = items().indexOf(e);
  S.sel=e.id; S.page=Math.floor(at/PAGE); S.docs=true; S.body=false; S.how=false; S.draft=null; S.resetPane=true; S.keyNav=true; S.fade=true; S.hl=null;
  render();
}
/* Right opens the next email in the list, Left the previous one */
function stepKey(key){
  const list = items(), at = list.findIndex(e=>e.id===S.sel);
  const n = key==="ArrowRight" ? list[at+1] : list[at-1];
  if(at>=0 && n) goTo(n);
}
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"&&ev.target.id==="q"&&S.q){ S.q=""; S.page=0; S.resetList=true; render(); return; }
  if(ev.key==="Escape"&&(S.help||S.langDlg||S.langMenu)){ S.help=false; S.langDlg=false; S.langMenu=false; render(); return; }
  if((ev.key==="Enter"||ev.key===" ") && ev.target.classList && (ev.target.classList.contains("src")||ev.target.classList.contains("brand"))){ ev.preventDefault(); ev.target.click(); return; }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if(typing||S.help||S.langDlg||location.hash==="#/next"||!location.hash||location.hash==="#/"||ev.ctrlKey||ev.metaKey||ev.altKey) return;
  if(S.sel && (ev.key==="ArrowLeft"||ev.key==="ArrowRight")){ ev.preventDefault(); stepKey(ev.key); }
});
window.addEventListener("hashchange", render);
ONE_PANE.addEventListener("change", render);   // the All done note moves between list and pane
render();

/* Signed in, marks made on another device appear after the first paint.
   Signed out this resolves to null and nothing happens. Deliberately after
   render(), so a slow or paused database never delays the page. */
Store?.pull(S.marks)?.then(function (merged) {
  if (!merged) return;
  S.marks = merged; saveMarks(); render();
});

/* The Supabase library is a module script, and module scripts run after this one
   but before DOMContentLoaded. So sign-in is wired here, not above. The callback
   fires at once with the saved session, then on every sign-in and sign-out. */
document.addEventListener("DOMContentLoaded", ()=>{
  S.authErr = window.Store?.authError?.() || null;
  S.authReady = !!window.Store?.onUser?.((user, event)=>{
    S.user = user; S.userMenu = false; render();
    // Outside the callback: supabase-js must not be called from inside its own auth callback.
    if(user && (event==="INITIAL_SESSION"||event==="SIGNED_IN")) setTimeout(()=>{
      window.Store?.pull(S.marks)?.then(merged=>{ if(merged){ S.marks = merged; saveMarks(); render(); } });
    }, 0);
  });
  if(S.authReady) render();
});
</script>
<script>
/* Installability: Chrome only offers "Install" when a worker with a fetch
   handler is registered. iOS ignores this harmlessly. Guarded and
   fire-and-forget, so an unsupported browser changes nothing. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("service worker not registered:", err);
    });
  });
}
</script>
</body>
