<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ship Happens</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#e8620c">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ship Happens">
<style>
:root{
  --bg:#fffdfb; --panel:#ffffff; --sunk:#f6f1ec; --line:#e8dfd6; --ink:#211b16; --mute:#7a6d63;
  --accent:#e8620c; --accent-ink:#ffffff; --accent-soft:#fdeadb;
  --bad:#c62828; --bad-soft:#fde8e6; --rev:#8a5a00; --rev-soft:#fff0b8; --ok:#1f8a4c; --ok-soft:#e2f4e9;
  --shadow:0 1px 2px rgba(33,27,22,.06),0 6px 20px rgba(33,27,22,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171310; --panel:#211b17; --sunk:#2a231d; --line:#3a3129; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#171310; --panel:#211b17; --sunk:#2a231d; --line:#3a3129; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;flex:none;overflow:visible}
.mark .ink{fill:var(--ink)}
.mark .paper{fill:var(--accent-soft);stroke:var(--accent);stroke-width:.9;stroke-linejoin:round}
.mark .win{fill:var(--panel)}
.mark .ring{fill:none;stroke:var(--ink);stroke-width:2.4}
.mark .line{fill:none;stroke:var(--accent);stroke-linecap:round}
.mark .keel{fill:none;stroke:var(--panel);stroke-width:.9}
.mark .ring{stroke-dasharray:100}
.mark.go .ring,.brand:hover .mark .ring{animation:draw 1.1s ease-out 1}
.mark.go .doc,.brand:hover .mark .doc{animation:slide .8s ease-out 1}
.mark.go .ship,.brand:hover .mark .ship{animation:rise 1.2s cubic-bezier(.3,1.5,.5,1) 1}
.mark.go .waves,.brand:hover .mark .waves{animation:roll 2.4s linear 1}
.mark.go .trail,.brand:hover .mark .trail{animation:trail 1.3s ease-out .9s 1 both}
.mark.go .fly,.brand:hover .mark .fly{animation:fly 1.3s ease-out .9s 1 both}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes slide{from{transform:translateX(-7px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@keyframes roll{to{transform:translateX(-40px)}}
@keyframes trail{from{stroke-dashoffset:60;opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes fly{from{transform:translate(-10px,12px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.mark *{animation:none!important}}
.logo{font-weight:800;letter-spacing:.02em;color:var(--accent);font-size:18px}
.grow{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ghost:hover{background:var(--sunk)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.ico{width:1.05em;height:1.05em;flex:none;vertical-align:-.17em;margin-right:4px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.kpi .ico{width:15px;height:15px;margin-right:5px;vertical-align:-2px}
.k-MISMATCH .ico{color:var(--bad)}.k-NEEDS_REVIEW .ico{color:var(--rev)}.k-OK .ico{color:var(--ok)}.k-CHECKED .ico{color:var(--mute)}
td .ico{width:.95em;height:.95em;margin-right:5px}
td.diff .ico{color:var(--bad)}td.gap .ico{color:var(--rev)}
.sbox{position:relative;display:flex;align-items:center;flex:1 1 200px;min-width:160px;max-width:340px}
.sbox .ico{position:absolute;left:10px;margin:0;color:var(--mute);pointer-events:none}
.bar input[type=search]{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px 6px 32px;font:inherit}
.bar input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.checking{display:flex;align-items:center;gap:8px}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spinr .8s linear infinite;display:inline-block;flex:none}
.prog{height:4px;border-radius:4px;background:var(--sunk);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;width:35%;background:var(--accent);border-radius:4px;animation:sweep 1.3s ease-in-out infinite}
.banner.fresh{animation:fresh 1.6s ease-out 1}
@keyframes spinr{to{transform:rotate(360deg)}}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@keyframes fresh{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent-soft)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.spin,.prog i,.banner.fresh{animation:none}}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-MISMATCH{background:var(--bad-soft);color:var(--bad)}
.b-NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.b-OK{background:var(--ok-soft);color:var(--ok)}
.b-none,.b-done{background:var(--sunk);color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
/* status strip */
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;padding:14px 16px 0}
.kpi{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;text-align:left}
.kpi b{display:block;font-size:26px;line-height:1.1}
.kpi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.kpi.k-CHECKED b{color:var(--mute)}.kpi.k-MISMATCH b{color:var(--bad)}.kpi.k-NEEDS_REVIEW b{color:var(--rev)}.kpi.k-OK b{color:var(--ok)}
.bar{display:flex;gap:8px;align-items:center;padding:12px 16px 0;flex-wrap:wrap}
.bar select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px}
.pager{display:flex;align-items:center;gap:8px}
.pager button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 12px}
.pager button:disabled{opacity:.4;cursor:default}
/* split view */
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:14px 16px 40px}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.item{cursor:pointer;transition:background .12s,border-color .12s}
.item:hover{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.item.on{border-color:var(--accent);background:var(--accent-soft)}
.item.checked{opacity:.6}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.item .t b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--mute)}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:64px;min-width:0}
.empty{padding:40px 10px;text-align:center;color:var(--mute)}
/* detail */
.detail h2{margin:0 0 2px;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.banner{border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:600}
.banner span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.banner.MISMATCH{background:var(--bad-soft);color:var(--bad)}
.banner.NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.banner.OK{background:var(--ok-soft);color:var(--ok)}
.banner.plain{background:var(--sunk);color:var(--ink)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td.f{color:var(--mute);white-space:nowrap}
.tbl .diff{background:var(--bad-soft);font-weight:600}
.tbl .gap{background:var(--rev-soft);font-style:italic}
.why{margin-top:6px;line-height:1.4}.why b{color:var(--ink)}
.linkbtn{display:block;background:none;border:0;color:var(--accent);padding:6px 0;margin-top:8px;font-weight:600;text-align:left}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.doc{min-width:0}
.doch{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.text{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:13px;overflow-wrap:anywhere;max-height:340px;overflow:auto}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.done{margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-weight:600;color:var(--ok)}
.live{margin-top:12px;font-size:13px}
.reply{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.reply input,.reply textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.reply textarea{resize:vertical;line-height:1.5}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;max-width:520px;max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.dlg h2{margin:0 0 8px;font-size:19px}
.dlg ol{padding-left:20px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
@media (min-width:821px){
  html,body{height:100%}
  body{overflow:hidden}
  #app{height:100%;display:flex;flex-direction:column}
  .split{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);padding-bottom:14px}
  .list,.pane{overflow-y:auto;min-height:0}
  .pane{position:static;align-self:stretch}
  .split{grid-template-columns:var(--listw,380px) 14px minmax(0,1fr);gap:0}
  .resizer{cursor:col-resize;touch-action:none;position:relative;user-select:none}
  .resizer::after{content:"";position:absolute;top:0;bottom:0;left:6px;width:2px;border-radius:2px;background:var(--line);transition:background .12s}
  .resizer:hover::after,.resizer.drag::after{background:var(--accent)}
  body.resizing{cursor:col-resize;user-select:none}
}
@media (max-width:820px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .kpi{padding:8px 10px}
  .kpi b{font-size:22px}
  .split{grid-template-columns:1fr}
  .resizer{display:none}
  .pane{position:static}
  .split.hasSel .list{display:none}
  .split:not(.hasSel) .pane{display:none}
  .docs{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="results.js"></script>
<script>
const API_BASE = (window.BLOCKERIS_API_BASE || "").replace(/\/$/, "");
const PAGE = 30;
const FIELDS = {shipper:"Shipper",consignee:"Consignee",notify_party:"Notify party",port_of_loading:"Port of loading",port_of_discharge:"Port of discharge",container_count:"Containers",gross_weight_kg:"Gross weight"};
const REASON = {
  missing_value:"A field is blank in one of the two documents.",
  unreadable:"One attachment could not be read (scanned or cut off).",
  wrong_doc_type:"One attachment is not a Shipping Instruction or a Bill of Lading.",
  missing_attachment:"The SI or the BL is not attached to this email."};
const LABEL = {MISMATCH:"Mismatch", NEEDS_REVIEW:"Needs review", OK:"Match"};
const OTHER = {SI_REQUEST:"SI request", INVOICE_QUERY:"Invoice", GENERAL:"General", SPAM:"Spam", BL_COMPARISON:"SI vs BL"};
const FOLDERS = [
  {k:"all", n:"All mail", f:()=>true},
  {k:"MISMATCH", n:"Mismatch", f:e=>e.status==="MISMATCH"},
  {k:"NEEDS_REVIEW", n:"Needs review", f:e=>e.status==="NEEDS_REVIEW"},
  {k:"OK", n:"Match", f:e=>e.status==="OK"},
  {k:"CHECKED", n:"Checked", f:e=>!!S.marks[e.id]},
  {k:"cmp", n:"SI vs BL checks", f:e=>e.category==="BL_COMPARISON"},
  {k:"SI_REQUEST", n:"SI requests", f:e=>e.category==="SI_REQUEST"},
  {k:"INVOICE_QUERY", n:"Invoice queries", f:e=>e.category==="INVOICE_QUERY"},
  {k:"GENERAL", n:"General", f:e=>e.category==="GENERAL"},
  {k:"SPAM", n:"Spam", f:e=>e.category==="SPAM"},
];
const MENU = ["all","MISMATCH","NEEDS_REVIEW","cmp","SI_REQUEST","INVOICE_QUERY","GENERAL","SPAM"];
const HELP = [
  "The boxes at the top filter the list: All mail, Mismatch, Needs review, Match. The Show menu has more folders, like invoices and SI requests.",
  "Type in the search box to find an email by subject, sender or number. Press Esc to clear it.",
  "Each page shows 30 emails, newest first. Use Newer and Older to move between pages.",
  "Click an email to read it on the right. On a phone it opens full screen, and List takes you back.",
  "Red (a cross) means the Shipping Instruction and the Bill of Lading disagree. The different field is highlighted, and all 7 fields are shown.",
  "Yellow (an eye) means a person needs to look. The reason is written under the banner.",
  "Green (a tick) means everything matches and there is nothing to do.",
  "The original documents are shown under the table. Click Original documents to hide them.",
  "When you are done, press Mark as checked. If the Bill of Lading needs fixing, press Reply to sender: a draft is written for you, so edit it and press Send reply. Made a wrong click? Press Undo. Your choices are saved in this browser only."
];

const S = {q:"", f:"all", page:0, sel:null, docs:true, body:false, help:false, live:{}, marks:loadMarks(), sent:loadSent(), draft:null, copied:null};
const byId = Object.fromEntries(RESULTS.map(e=>[e.id,e]));
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const folder = k=>FOLDERS.find(x=>x.k===k);
const count = k=>RESULTS.filter(folder(k).f).length;
const items = ()=>{
  const term = S.q.trim().toLowerCase().replace(/^#/,"");
  return RESULTS.filter(folder(S.f).f).filter(e=>!term || (e.subject+" "+e.from+" "+e.id.replace("email_","")).toLowerCase().includes(term));
};
const who = e=>esc(e.from.replace(/<.*>/,"").trim()||e.from);

function loadMarks(){ try{ return JSON.parse(localStorage.getItem("blockeris.marks")||"{}"); }catch(_){ return {}; } }
function loadSent(){ try{ return JSON.parse(localStorage.getItem("blockeris.sent")||"{}"); }catch(_){ return {}; } }
function saveSent(){ try{ localStorage.setItem("blockeris.sent", JSON.stringify(S.sent)); }catch(_){} }
function saveMarks(){ try{ localStorage.setItem("blockeris.marks", JSON.stringify(S.marks)); }catch(_){} }

const ICO = p=>`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const ICON = {
  OK: ICO('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>'),
  MISMATCH: ICO('<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'),
  NEEDS_REVIEW: ICO('<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'),
  CHECKED: ICO('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  GAP: ICO('<path d="M5 12h14"/>')
};
const badge = e=>e.status?`<span class="badge b-${e.status}">${ICON[e.status]}${LABEL[e.status]}</span>`:`<span class="badge b-none">${OTHER[e.category]||esc(e.category)}</span>`;

function rowsHTML(rows){
  return rows.map(r=>{
    const bad = r.verdict==="mismatch", gap = r.verdict==="missing";
    return `<tr><td class="f">${FIELDS[r.field]}</td><td class="${gap&&!r.si_raw?"gap":""}">${gap&&!r.si_raw?ICON.GAP:""}${esc(r.si_raw)||"(blank)"}</td><td class="${bad?"diff":""} ${gap&&!r.bl_raw?"gap":""}">${bad?ICON.MISMATCH:gap&&!r.bl_raw?ICON.GAP:""}${esc(r.bl_raw)||"(blank)"}</td></tr>`;
  }).join("");
}
const table = rows=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Field</th><th>Shipping Instruction</th><th>Draft Bill of Lading</th></tr></thead><tbody>${rowsHTML(rows)}</tbody></table></div>`;

function docsHTML(e){
  const box = (role,name)=>{
    const d = e.docs[role];
    const body = !d ? "Not attached to this email." : d.text ? esc(d.text) : "This file could not be read.";
    return `<div class="doc"><div class="doch">${name}${d?` (${esc(d.name)})`:""}</div><div class="text">${body}</div></div>`;
  };
  return `<button class="linkbtn" data-a="docs">${S.docs?"▾":"▸"} Original documents</button>` + (S.docs?`<div class="docs">${box("SI","Shipping Instruction")}${box("BL","Draft Bill of Lading")}</div>`:"");
}

const line = r=>`- ${FIELDS[r.field]}: the SI says ${r.si_raw||"(blank)"}, the draft BL says ${r.bl_raw||"(blank)"}`;
function draftFor(e){
  const rows = e.rows||[];
  let ask;
  if(e.status==="MISMATCH"){
    ask = `I checked the draft Bill of Lading against the Shipping Instruction and found ${e.defect_fields.length===1?"a difference":"these differences"}:\n\n${rows.filter(r=>r.verdict==="mismatch").map(line).join("\n")}\n\nCould you please amend the draft BL and send it again for checking?`;
  } else if(e.review_reason==="missing_value"){
    ask = `I could not complete the check because a value is blank in one of the documents:\n\n${rows.filter(r=>r.verdict==="missing").map(line).join("\n")}\n\nCould you please confirm the missing values and send the updated document?`;
  } else if(e.review_reason==="missing_attachment"){
    const have = Object.keys(e.docs||{});
    const need = ["SI","BL"].filter(r=>!have.includes(r)).map(r=>r==="SI"?"Shipping Instruction":"draft Bill of Lading");
    ask = `I could not find the ${need.join(" and ")||"documents"} attached to your email. Could you please send both the Shipping Instruction and the draft Bill of Lading so I can check them?`;
  } else if(e.review_reason==="unreadable"){
    ask = "One of the attached files could not be opened (it may be a scan or cut off). Could you please resend it as a text-based PDF, Word or Excel file?";
  } else if(e.review_reason==="wrong_doc_type"){
    ask = "One of the attached files does not look like a Shipping Instruction or a draft Bill of Lading. Could you please send the correct documents?";
  } else {
    ask = "Could you please check the documents and send them again?";
  }
  return {id:e.id, to:e.from, subject:/^re[:_]/i.test(e.subject)?e.subject:"RE: "+e.subject,
          body:`Hi,\n\nThank you for your email. ${ask}\n\nThank you.\nBest regards,\n`};
}

function why(e){
  const cat = esc(OTHER[e.category]||e.category);
  if(e.decided_by==="fallback") return `<div class="why small mute"><b>Why ${cat}?</b> A simple keyword rule filed this, not the AI.</div>`;
  const pct = typeof e.class_confidence==="number" ? ` (${Math.round(e.class_confidence*100)}% sure)` : "";
  return `<div class="why small mute"><b>Why ${cat}?</b> ${esc(e.class_evidence||"Filed by the AI.")}${pct}</div>`;
}

function canRecheck(e){ return API_BASE && e.docs && e.docs.SI && e.docs.BL && e.docs.SI.pairs.length && e.docs.BL.pairs.length; }

function detail(e){
  const live = S.live[e.id];
  const view = live && live.result ? {...e, ...live.result} : e;
  const fresh = live && live.fresh ? "fresh" : "";
  let h = `<div class="detail"><h2>${esc(e.subject)}</h2><div class="mute small">${who(e)} · ${e.id.replace("email_","#")}</div>${why(e)}`;
  if(view.status==="MISMATCH"){
    const n = view.defect_fields.length;
    h += `<div class="banner MISMATCH ${fresh}">${ICON.MISMATCH}${n} field${n>1?"s":""} differ<span>Fix the Bill of Lading before it is released.</span></div>${table(view.rows)}`;
  } else if(view.status==="NEEDS_REVIEW"){
    h += `<div class="banner NEEDS_REVIEW ${fresh}">${ICON.NEEDS_REVIEW}Needs a person to look<span>${REASON[view.review_reason]||""}</span></div>`;
    if(view.rows.length) h += table(view.rows);
  } else if(view.status==="OK"){
    h += `<div class="banner OK ${fresh}">${ICON.OK}All 7 fields match<span>Nothing to do.</span></div>${table(view.rows)}`;
  } else {
    h += `<div class="banner plain">Not an SI vs BL check<span>Filed under ${esc((OTHER[e.category]||e.category).toLowerCase())}${e.decided_by==="fallback"?" by a simple keyword rule, not the AI":""}.</span></div>`;
  }
  if(e.docs) h += docsHTML(e);
  h += `<button class="linkbtn" data-a="body">${S.body?"▾":"▸"} Cover email</button>` + (S.body?`<div class="text">${esc(e.body)}</div>`:"");
  const m = S.marks[e.id];
  if(e.status==="MISMATCH"||e.status==="NEEDS_REVIEW"){
    const d = S.draft && S.draft.id===e.id ? S.draft : null, sent = S.sent[e.id];
    if(m) h += `<div class="done"><span>${m==="ok"?"Marked as checked":"Reply sent (demo)"}</span><button class="btn alt" data-a="undo" data-id="${e.id}">Undo</button></div>` +
      (sent?`<div class="mute small" style="margin-top:8px">To ${esc(sent.to)}</div><div class="text" style="margin-top:4px">${esc(sent.body)}</div>`:"");
    else if(d) h += `<div class="reply"><div class="doch">Reply to the sender</div>
      <label class="small mute" for="r-to">To</label><input id="r-to" data-f="to" value="${esc(d.to)}">
      <label class="small mute" for="r-sub">Subject</label><input id="r-sub" data-f="subject" value="${esc(d.subject)}">
      <label class="small mute" for="r-body">Message</label><textarea id="r-body" data-f="body" rows="12">${esc(d.body)}</textarea>
      <div class="actions"><button class="btn" data-a="send" data-id="${e.id}">Send reply</button><button class="btn alt" data-a="copy">${S.copied===e.id?"Copied":"Copy"}</button><button class="btn alt" data-a="mailto">Open in your email app</button><button class="ghost" data-a="discard">Discard</button></div>
      <div class="small mute" style="margin-top:8px">Demo: Send reply only marks this email as replied. Nothing is emailed. Use Open in your email app to send it for real.</div></div>`;
    else h += `<div class="actions"><button class="btn" data-a="mark" data-k="ok" data-id="${e.id}">Mark as checked</button><button class="btn alt" data-a="draft" data-id="${e.id}">Reply to sender</button></div>`;
  }
  if(canRecheck(e)){
    h += `<div class="live" aria-live="polite">${live&&live.busy
      ? `<div class="checking"><span class="spin"></span><span>Checking with the AI<span class="mute"> \u00b7 <span id="elapsed">${Math.floor((Date.now()-live.t0)/1000)}</span>s</span></span></div><div class="prog"><i></i></div><div class="mute small">The first check can take up to a minute while the server wakes up.</div>`
      : `${live&&live.result?"":`<span class="mute small">Showing the saved AI result. </span>`}<button class="ghost" data-a="recheck" data-id="${e.id}">Check again with AI</button>`}`;
    if(live&&live.note) h += ` <span class="${live.error?"":"mute"}">${esc(live.note)}</span>`;
    h += `</div>`;
  }
  return h + "</div>";
}

async function recheck(id){
  const e = byId[id];
  S.live[id] = {busy:true, t0:Date.now()}; render();
  const tick = setInterval(()=>{ const el=document.getElementById("elapsed"); if(el) el.textContent=Math.floor((Date.now()-S.live[id].t0)/1000); }, 1000);
  const ctrl = new AbortController(); const timer = setTimeout(()=>ctrl.abort(), 90000);
  try{
    const res = await fetch(API_BASE+"/process-email", {method:"POST", headers:{"Content-Type":"application/json"}, signal:ctrl.signal,
      /* attachments must be sent: EmailInput defaults the field to [], and the
         router locates the SI and BL by walking that list. Omit it and every
         email resolves to no files and comes back NEEDS_REVIEW. Bare file
         names are fine - resolve_attachment_path looks them up under
         data/attachments/. */
      body:JSON.stringify({email_id:id, from:e.from, subject:e.subject, body:e.body,
        attachments:[e.docs.SI.name, e.docs.BL.name].filter(Boolean)})});
    if(!res.ok) throw new Error("HTTP "+res.status);
    /* One call runs all five stages; the page only redraws the verdict. */
    const result = (await res.json()).ComparisonResult;
    if(!result) throw new Error("no ComparisonResult");
    const same = result.status===e.status && JSON.stringify(result.defect_fields)===JSON.stringify(e.defect_fields);
    S.live[id] = {result, fresh:true, note: same?"Live AI check done. Same result as the saved one.":"Live AI check done. It differs from the saved result, so please look closely."};
  }catch(err){
    S.live[id] = {error:true, note:"Could not reach the AI service, so this shows the saved result. Try again in a moment."};
  }finally{ clearTimeout(timer); clearInterval(tick); render(); if(S.live[id]) S.live[id].fresh=false; }
}

let logoIntro = false;

  const rows = list.slice(S.page*PAGE, to).map(e=>{
    const m = S.marks[e.id];

  }).join("");
  const pane = S.sel ? `<button class="ghost" data-a="back" style="margin-bottom:10px">← List</button>${detail(byId[S.sel])}` : `<div class="empty">Pick an email to see it here.</div>`;
  const help = S.help ? `<div class="ov" data-a="helpclose"><div class="dlg" role="dialog" aria-label="How to use" data-a="stay"><h2>How to use this page</h2><ol>${HELP.map(t=>`<li>${t}</li>`).join("")}</ol><button class="btn" data-a="helpclose">Got it</button></div></div>` : "";
  const ae = document.activeElement, focusQ = ae && ae.id==="q" ? [ae.selectionStart, ae.selectionEnd] : null;
  const brand = q(".brand");
  document.getElementById("app").innerHTML =
    `<div class="top"><span class="brand"><svg class="mark" viewBox="0 0 64 64" role="img" aria-label="Ship Happens logo"><defs><clipPath id="mk"><circle cx="32" cy="32" r="27.2"/></clipPath></defs><g clip-path="url(#mk)"><g class="doc"><path class="paper" d="M12.5 19q0-3 3-3h8l5 5V48h-16z"/><path class="line" stroke-width="1.5" d="M15.5 23h5"/><path class="line" stroke-width="1" d="M15.5 27.500h10M15.5 31h10M15.5 34.500h10M15.5 38h10M15.5 41.500h7"/></g><path class="line" stroke-width="2.6" d="M41 19c11-5 17 12 8 27"/><path class="line" stroke-width="1.6" opacity=".7" d="M43 27c6 2 6 10 1 15"/></g><path class="line trail" pathLength="60" stroke-width="2.2" d="M38 24c9 6 15 1 10-9"/><g class="ship"><path class="ink" d="M32 13v7" stroke="var(--ink)" stroke-width="1.3"/><path class="ink" d="M30 15.5h4" stroke="var(--ink)" stroke-width="1.1"/><rect class="ink" x="28" y="20" width="8" height="5" rx="1"/><rect class="ink" x="24.5" y="25" width="15" height="6" rx="1"/><rect class="ink" x="21" y="31" width="22" height="7" rx="1"/><path class="win" d="M23 33.5h1.6v1.6H23zM26 33.5h1.6v1.6H26zM29 33.5h1.6v1.6H29zM32 33.5h1.6v1.6H32zM35 33.5h1.6v1.6H35zM38 33.5h1.6v1.6H38z"/><path class="ink" d="M18 38h28l-5 14H23z"/><path class="keel" d="M32 39v13"/></g><g clip-path="url(#mk)"><g class="waves"><path class="line" stroke-width="3.2" d="M-34 51q10-6 20 0t20 0t20 0t20 0t20 0t20 0"/><path class="line" stroke-width="1.6" opacity=".6" d="M-34 56q10-5 20 0t20 0t20 0t20 0t20 0t20 0"/></g></g><circle class="ring" cx="32" cy="32" r="28" pathLength="100" transform="rotate(-90 32 32)"/><g class="fly"><g transform="translate(46 4) scale(.7) rotate(45 12 12)"><path class="ink" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 00-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></g></g></svg><span class="logo">SHIP HAPPENS</span></span><span class="mute small">Shipping documents</span><span class="grow"></span><button class="ghost" data-a="help">How to use</button><button class="ghost" data-a="theme" aria-label="Switch light or dark">Light / Dark</button></div>
     <div class="kpis">${kp("all","All mail")}${kp("MISMATCH","Mismatch")}${kp("NEEDS_REVIEW","Needs review")}${kp("OK","Match")}${kp("CHECKED","Checked")}</div>
     <div class="bar"><label class="mute small" for="foldersel">Show</label><select id="foldersel" data-a="foldersel">${MENU.includes(S.f)?"":`<option value="" selected disabled>Other folders</option>`}${MENU.map(k=>`<option value="${k}" ${S.f===k?"selected":""}>${folder(k).n} (${count(k)})</option>`).join("")}</select><span class="sbox">${ICO('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>')}<input id="q" type="search" placeholder="Search mail" aria-label="Search mail" value="${esc(S.q)}" autocomplete="off"></span><span class="grow"></span>
       <div class="pager small num">${from}–${to} of ${total}<button data-a="newer" ${S.page===0?"disabled":""}>Newer</button><button data-a="older" ${to>=total?"disabled":""}>Older</button></div></div>
     <div class="split ${S.sel?"hasSel":""}"><div class="list">${rows||`<div class="empty">No emails match${S.q.trim()?` \u201c${esc(S.q.trim())}\u201d`:""} in this folder.</div>`}</div><div class="resizer" role="separator" aria-orientation="vertical" aria-label="Drag to resize"></div><div class="pane">${pane}</div></div>${help}`;
  if(focusQ&&q("#q")){ const box=q("#q"); box.focus(); try{ box.setSelectionRange(focusQ[0],focusQ[1]); }catch(_){} }

  else if(!logoIntro){ logoIntro=true; const m=q(".mark"); if(m){ m.classList.add("go"); setTimeout(()=>m.classList.remove("go"),3200); } }
  if(keep){ const pane=q(".pane"), list=q(".list"); if(pane&&keep.pane) pane.scrollTop=keep.pane; if(list&&keep.list) list.scrollTop=keep.list; if(keep.y) window.scrollTo(0,keep.y); }
  if(S.scrollTo){ const el=q(S.scrollTo); if(el) el.scrollIntoView({block:"start"}); S.scrollTo=null; }
}

/* drag the divider between list and detail (desktop only; the handle is hidden on mobile) */
try{ const w=localStorage.getItem("listw"); if(w) document.documentElement.style.setProperty("--listw", w+"px"); }catch(e){}
document.addEventListener("pointerdown", ev=>{
  const h = ev.target.closest && ev.target.closest(".resizer");
  if(!h || ev.button) return;
  ev.preventDefault();
  const split = h.parentElement, left = split.getBoundingClientRect().left;
  let w = 0;
  h.classList.add("drag"); document.body.classList.add("resizing");
  const move = e=>{
    const max = split.clientWidth - 14 - 360;
    w = Math.max(240, Math.min(max, e.clientX - left));
    document.documentElement.style.setProperty("--listw", w+"px");
  };
  const up = ()=>{
    document.removeEventListener("pointermove", move); document.removeEventListener("pointerup", up);
    h.classList.remove("drag"); document.body.classList.remove("resizing");
    try{ if(w) localStorage.setItem("listw", Math.round(w)); }catch(e){}
  };
  document.addEventListener("pointermove", move); document.addEventListener("pointerup", up);
});

document.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-a]"); if(!t) return;
  const a = t.dataset.a, k = t.dataset.k, id = t.dataset.id;
  if(a==="stay"||a==="foldersel") return;
  if(a==="theme"){ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches; r.dataset.theme = dark?"light":"dark"; return; }
  if(a==="help") S.help=true; else if(a==="helpclose") S.help=false;
  else if(a==="folder"){ S.f=k; S.page=0; S.sel=null; S.reset=true; }
  else if(a==="newer"){ S.page--; S.reset=true; } else if(a==="older"){ S.page++; S.reset=true; }
  else if(a==="open"){ S.sel=id; S.docs=true; S.body=false; S.draft=null; S.reset=true; }
  else if(a==="back"){ S.sel=null; S.draft=null; S.reset=true; }
  else if(a==="docs") S.docs=!S.docs; else if(a==="body") S.body=!S.body;
  else if(a==="mark"){ S.marks[id]=k; saveMarks(); }
  else if(a==="undo"){ delete S.marks[id]; delete S.sent[id]; saveMarks(); saveSent(); }
  else if(a==="draft"){ S.draft = draftFor(byId[id]); S.copied=null; S.scrollTo=".reply"; }
  else if(a==="discard"){ S.draft=null; }
  else if(a==="send"){ S.sent[id]={to:S.draft.to, subject:S.draft.subject, body:S.draft.body}; S.marks[id]="back"; S.draft=null; saveSent(); saveMarks(); }
  else if(a==="copy"){ try{ navigator.clipboard.writeText(S.draft.body); S.copied=S.draft.id; }catch(_){} }
  else if(a==="mailto"){ location.href = "mailto:"+encodeURIComponent(S.draft.to)+"?subject="+encodeURIComponent(S.draft.subject)+"&body="+encodeURIComponent(S.draft.body); return; }
  else if(a==="recheck") return recheck(id);
  render();
});
document.addEventListener("input", ev=>{
  if(ev.target.id==="q"){ S.q=ev.target.value; S.page=0; S.reset=true; if(matchMedia("(max-width:820px)").matches) S.sel=null; render(); return; }
  const f = ev.target.dataset.f;
  if(f && S.draft) S.draft[f] = ev.target.value;   // no redraw while typing, or the cursor would jump
});
document.addEventListener("change", ev=>{
  if(ev.target.dataset.a==="foldersel"){ S.f=ev.target.value; S.page=0; S.sel=null; S.reset=true; render(); }
});
document.addEventListener("keydown", ev=>{ if(ev.key==="Escape"&&ev.target.id==="q"&&S.q){ S.q=""; S.page=0; S.reset=true; render(); return; } if(ev.key==="Escape"&&S.help){ S.help=false; render(); } });
render();
</script>
<script>
/* Installability: Chrome only offers "Install" when a worker with a fetch
   handler is registered. iOS ignores this harmlessly. Guarded and
   fire-and-forget, so an unsupported browser or a failed registration
   changes nothing about the page. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function (err) {
      console.warn("service worker not registered:", err);
    });
  });
}
</script>
