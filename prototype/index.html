<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE: Blockeris inbox (throwaway)</title>
<!--
PROTOTYPE, throwaway. Question: what should the shipping-ops inbox + SI vs BL check look like?
Three structurally different variants on one page, switch with the bar at the bottom, the arrow keys, or ?variant=A|B|C.
Data: data.js, built by make_data.py from the real extraction results (520 emails).
Categories for non-comparison emails are a keyword guess (real classifier not merged). No dates in the dataset, so email id order stands in for newest first.
Read-only: buttons only change in-memory state. Open by double-clicking this file.
-->
<style>
:root{
  --bg:#fffdfb; --panel:#ffffff; --sunk:#f6f1ec; --line:#e8dfd6; --ink:#211b16; --mute:#7a6d63;
  --accent:#e8620c; --accent-ink:#ffffff; --accent-soft:#fdeadb;
  --bad:#c62828; --bad-soft:#fde8e6; --rev:#8a5a00; --rev-soft:#fff0b8; --ok:#1f8a4c; --ok-soft:#e2f4e9;
  --shadow:0 1px 2px rgba(33,27,22,.06),0 6px 20px rgba(33,27,22,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171310; --panel:#211b17; --sunk:#2a231d; --line:#3a3129; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);}}
:root[data-theme="dark"]{
  --bg:#171310; --panel:#211b17; --sunk:#2a231d; --line:#3a3129; --ink:#f4ece4; --mute:#a99a8d;
  --accent:#ff8a3d; --accent-ink:#1a0f06; --accent-soft:#3a2312;
  --bad:#ff7b72; --bad-soft:#3d1f1d; --rev:#ffd24d; --rev-soft:#3f3410; --ok:#5fd18d; --ok-soft:#173424;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4);}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:64px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.logo{font-weight:800;letter-spacing:.02em;color:var(--accent);font-size:18px}
.grow{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ghost:hover{background:var(--sunk)}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.alt{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.badge{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.b-MISMATCH{background:var(--bad-soft);color:var(--bad)}
.b-NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.b-OK{background:var(--ok-soft);color:var(--ok)}
.b-none{background:var(--sunk);color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.pager{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pager button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 12px}
.pager button:disabled{opacity:.4;cursor:default}
/* detail */
.detail h2{margin:0 0 2px;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.banner{border-radius:12px;padding:12px 14px;margin:14px 0;font-weight:600}
.banner.MISMATCH{background:var(--bad-soft);color:var(--bad)}
.banner.NEEDS_REVIEW{background:var(--rev-soft);color:var(--rev)}
.banner.OK{background:var(--ok-soft);color:var(--ok)}
.banner span{display:block;font-weight:400;color:var(--ink);margin-top:2px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tbl th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tr:last-child td{border-bottom:0}
.tbl td.f{color:var(--mute);white-space:nowrap}
.tbl .diff{background:var(--bad-soft);font-weight:600}
.tbl .gap{background:var(--rev-soft);font-style:italic}
.linkbtn{display:block;background:none;border:0;color:var(--accent);padding:6px 0;margin-top:8px;font-weight:600;text-align:left}
.docs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.doc{min-width:0}
.doch{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:4px}
.docs .body{max-height:340px;overflow:auto}
@media (max-width:820px){.docs{grid-template-columns:1fr}}
.body{white-space:pre-wrap;background:var(--sunk);border-radius:10px;padding:12px;font-size:13px;overflow-wrap:anywhere}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.done{margin-top:16px;font-weight:600;color:var(--ok)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:30}
.dlg{background:var(--panel);color:var(--ink);border-radius:16px;padding:20px;max-width:520px;max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.dlg h2{margin:0 0 8px;font-size:19px}
.dlg ol{padding-left:20px;margin:0 0 16px;display:flex;flex-direction:column;gap:8px}
/* switcher */
#sw{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:#111;color:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);z-index:20;max-width:calc(100vw - 24px)}
#sw button{background:#333;color:#fff;border:0;border-radius:999px;width:34px;height:34px;font-size:16px}
#sw .lab{padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A: gmail */
.A .wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 110px)}
.A .side{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:2px;background:var(--panel)}
.A .side button{display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-radius:0 999px 999px 0;padding:8px 14px;text-align:left}
.A .side button:hover{background:var(--sunk)}
.A .side button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.A .main{padding:12px 16px;min-width:0}
.A .bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.A .row{display:grid;grid-template-columns:96px 170px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:9px 8px}
.A .row:hover{box-shadow:var(--shadow);position:relative}
.A .row .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.A .row .from{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
@media (max-width:760px){
  .A .wrap{grid-template-columns:1fr}
  .A .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .A .side button{border-radius:999px;white-space:nowrap}
  .A .row{grid-template-columns:1fr auto;grid-template-areas:"from st" "s s"}
  .A .row .from{grid-area:from}.A .row .st{grid-area:st}.A .row .s{grid-area:s}
}
/* B: split with status strip */
.B .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 0}
.B .kpi{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;text-align:left}
.B .kpi b{display:block;font-size:26px;line-height:1.1}
.B .kpi.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.B .kpi.k-MISMATCH b{color:var(--bad)}.B .kpi.k-NEEDS_REVIEW b{color:var(--rev)}.B .kpi.k-OK b{color:var(--ok)}
.B .split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;padding:14px 16px}
.B .list{display:flex;flex-direction:column;gap:6px}
.B .item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.B .item.on{border-color:var(--accent);background:var(--accent-soft)}
.B .item .t{display:flex;justify-content:space-between;gap:8px}
.B .item .sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:var(--mute)}
.B .pane{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;align-self:start;position:sticky;top:64px}
.B .empty{padding:40px 10px;text-align:center;color:var(--mute)}
.B .cat{display:flex;gap:8px;align-items:center;padding:8px 16px 0}
.B .cat select{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 8px;font:inherit}
@media (max-width:820px){
  .B .kpis{grid-template-columns:repeat(2,1fr)}
  .B .split{grid-template-columns:1fr}
  .B .pane{position:static}
  .B .split.hasSel .list{display:none}
  .B .split:not(.hasSel) .pane{display:none}
}
/* C: focus queue */
.C .page{max-width:760px;margin:0 auto;padding:20px 16px}
.C .hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}
.C .hero .big{font-size:44px;font-weight:800;line-height:1;color:var(--accent)}
.C .split3{display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 16px}
.C .prog{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:8px 0}
.C .prog i{display:block;height:100%;background:var(--accent)}
.C .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.C .tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left}
.C .tile b{display:block;font-size:22px}
.C .tile:hover{border-color:var(--accent)}
.C .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.C .decide{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.C .decide .btn{padding:14px}
.C .li{display:flex;gap:10px;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.C .li .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sw"></div>
<script src="data.js"></script>
<script>
const VARIANTS = {A:"Gmail-style inbox", B:"Status strip + split view", C:"One at a time queue"};
const CATS = [
  {k:"attention", n:"Needs attention", f:e=>e.status==="MISMATCH"||e.status==="NEEDS_REVIEW"},
  {k:"all", n:"All mail", f:()=>true},
  {k:"cmp", n:"SI vs BL checks", f:e=>e.cat==="BL_COMPARISON"},
  {k:"si", n:"SI requests", f:e=>e.cat==="SI_REQUEST"},
  {k:"inv", n:"Invoice queries", f:e=>e.cat==="INVOICE_QUERY"},
  {k:"gen", n:"General", f:e=>e.cat==="GENERAL"},
  {k:"spam", n:"Spam", f:e=>e.cat==="SPAM"},
];
const LABEL = {MISMATCH:"Mismatch", NEEDS_REVIEW:"Needs review", OK:"Match"};
const FIELDS = {shipper:"Shipper",consignee:"Consignee",notify_party:"Notify party",port_of_loading:"Port of loading",port_of_discharge:"Port of discharge",container_count:"Containers",gross_weight_kg:"Gross weight"};
const REASON = {
  missing_value:"A field is blank in one of the two documents.",
  unreadable:"One attachment could not be read (scanned or cut off).",
  wrong_doc_type:"One attachment is not a Shipping Instruction or a Bill of Lading.",
  missing_attachment:"The SI or the BL is not attached to this email."};
const PAGE = 30;
const S = {v:(new URLSearchParams(location.search).get("variant")||"A").toUpperCase(), cat:"attention", chip:"all", page:0, sel:null, more:false, body:false, docs:true, help:false, done:{}, qi:0, mode:"home"};
if(!VARIANTS[S.v]) S.v="A";
const byId = Object.fromEntries(EMAILS.map(e=>[e.id,e]));
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const catDef = k=>CATS.find(c=>c.k===k);
const count = k=>EMAILS.filter(catDef(k).f).length;
const statusCount = s=>EMAILS.filter(e=>e.status===s).length;
function items(){
  let r = EMAILS.filter(catDef(S.cat).f);
  if(S.chip!=="all") r = r.filter(e=>e.status===S.chip);
  return r;
}
const queue = ()=>EMAILS.filter(catDef("attention").f).filter(e=>!S.done[e.id]);
const badge = e=>e.status?`<span class="badge b-${e.status}">${LABEL[e.status]}</span>`:`<span class="badge b-none">${esc(({SI_REQUEST:"SI request",INVOICE_QUERY:"Invoice",GENERAL:"General",SPAM:"Spam"})[e.cat]||e.cat)}</span>`;
const who = e=>esc(e.from.replace(/<.*>/,"").trim()||e.from);

function chipsHTML(){
  if(S.cat!=="attention" && S.cat!=="cmp") return "";
  const opts = S.cat==="attention" ? [["all","All"],["MISMATCH","Mismatch"],["NEEDS_REVIEW","Needs review"]] : [["all","All"],["MISMATCH","Mismatch"],["NEEDS_REVIEW","Needs review"],["OK","Match"]];
  return `<div class="chips">${opts.map(([k,n])=>`<button class="chip ${S.chip===k?"on":""}" data-a="chip" data-k="${k}">${n}</button>`).join("")}</div>`;
}
function pagerHTML(total){
  const from = total?S.page*PAGE+1:0, to = Math.min(total,(S.page+1)*PAGE);
  return `<div class="pager small num">${from}–${to} of ${total}<button data-a="newer" ${S.page===0?"disabled":""}>Newer</button><button data-a="older" ${to>=total?"disabled":""}>Older</button></div>`;
}
const pageOf = list=>list.slice(S.page*PAGE,(S.page+1)*PAGE);

function tableRows(rows, only){
  return rows.filter(r=>!only||only(r)).map(r=>{
    const bad = r.verdict==="mismatch", gap = r.verdict==="missing";
    return `<tr><td class="f">${FIELDS[r.field]}</td><td class="${gap&&!r.si_raw?"gap":""}">${esc(r.si_raw)||"(blank)"}</td><td class="${bad?"diff":""} ${gap&&!r.bl_raw?"gap":""}">${esc(r.bl_raw)||"(blank)"}</td></tr>`;
  }).join("");
}
const tbl = body=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Field</th><th>Shipping Instruction</th><th>Draft Bill of Lading</th></tr></thead><tbody>${body}</tbody></table></div>`;

function detail(e, opts={}){
  const d = S.done[e.id];
  let h = `<div class="detail"><h2>${esc(e.subject)}</h2><div class="mute small">${who(e)} · ${e.id.replace("email_","#")}</div>`;
  if(e.status==="MISMATCH"){
    const diffs = e.rows.filter(r=>r.verdict==="mismatch");
    h += `<div class="banner MISMATCH">${diffs.length} field${diffs.length>1?"s":""} differ<span>Fix the Bill of Lading before it is released.</span></div>`;
    h += tbl(tableRows(e.rows));
    const docBox = (role,name)=>`<div class="doc"><div class="doch">${name}</div><div class="body">${e.docs[role]?esc(e.docs[role]):"This original is a PDF, Word or Excel file, so it is not shown in the prototype."}</div></div>`;
    h += `<button class="linkbtn dochead" data-a="docs">${S.docs?"▾":"▸"} Original documents</button>`;
    if(S.docs) h += `<div class="docs">${docBox("SI","Shipping Instruction")}${docBox("BL","Draft Bill of Lading")}</div>`;
  } else if(e.status==="NEEDS_REVIEW"){
    h += `<div class="banner NEEDS_REVIEW">Needs a person to look<span>${REASON[e.reason]}</span></div>`;
    if(e.rows) h += tbl(tableRows(e.rows,r=>r.verdict!=="match"));
  } else if(e.status==="OK"){
    h += `<div class="banner OK">All 7 fields match<span>Nothing to do.</span></div>`;
    h += `<button class="linkbtn" data-a="more">${S.more?"Hide":"Show"} the fields</button>`;
    if(S.more) h += tbl(tableRows(e.rows));
  } else {
    h += `<div class="banner" style="background:var(--sunk)">Not an SI vs BL check<span>Filed under ${esc(e.cat.replace("_"," ").toLowerCase())} (prototype guess).</span></div>`;
  }
  h += `<button class="linkbtn" data-a="body">${S.body?"Hide":"Show"} the email</button>`;
  if(S.body) h += `<div class="body">${esc(e.body)}</div>`;
  if(e.status==="MISMATCH"||e.status==="NEEDS_REVIEW"){
    if(d) h += `<div class="done">${d==="ok"?"Marked as checked":"Sent back to the sender"}</div>`;
    else if(!opts.noActions) h += `<div class="actions"><button class="btn" data-a="done" data-k="ok" data-id="${e.id}">Mark as checked</button><button class="btn alt" data-a="done" data-k="back" data-id="${e.id}">Send back to sender</button></div>`;
  }
  return h + "</div>";
}

/* ---------- Variant A: Gmail-style ---------- */
function viewA(){
  const list = items();
  const side = CATS.map(c=>`<button class="${S.cat===c.k?"on":""}" data-a="cat" data-k="${c.k}"><span>${c.n}</span><span class="num">${count(c.k)}</span></button>`).join("");
  let main;
  if(S.sel){
    const e = byId[S.sel], i = list.findIndex(x=>x.id===e.id);
    main = `<div class="bar"><button class="ghost" data-a="back">← Back to list</button><span class="grow"></span><button class="ghost" data-a="nav" data-k="-1" ${i<=0?"disabled":""}>Newer</button><button class="ghost" data-a="nav" data-k="1" ${i>=list.length-1?"disabled":""}>Older</button></div>${detail(e)}`;
  } else {
    main = `<div class="bar">${chipsHTML()}<span class="grow"></span>${pagerHTML(list.length)}</div>` +
      pageOf(list).map(e=>`<button class="row" data-a="open" data-id="${e.id}"><span class="st">${badge(e)}</span><span class="from">${who(e)}</span><span class="s">${esc(e.subject)}</span></button>`).join("");
  }
  return `<div class="A"><div class="top"><span class="logo">BLOCKERIS</span><span class="mute small">Shipping documents</span><span class="grow"></span>${themeBtn()}</div><div class="wrap"><nav class="side">${side}</nav><div class="main">${main}</div></div></div>`;
}

/* ---------- Variant B: status strip + split ---------- */
function viewB(){
  const list = items();
  const kp = (k,label,n,cat,chip)=>`<button class="kpi k-${k} ${S.cat===cat&&S.chip===chip?"on":""}" data-a="kpi" data-cat="${cat}" data-chip="${chip}"><b class="num">${n}</b>${label}</button>`;
  const strip = kp("all","All mail",EMAILS.length,"all","all")+kp("MISMATCH","Mismatch",statusCount("MISMATCH"),"cmp","MISMATCH")+kp("NEEDS_REVIEW","Needs review",statusCount("NEEDS_REVIEW"),"cmp","NEEDS_REVIEW")+kp("OK","Match",statusCount("OK"),"cmp","OK");
  const other = `<div class="cat"><label class="mute small" for="catsel">Show</label><select id="catsel" data-a="catsel">${CATS.map(c=>`<option value="${c.k}" ${S.cat===c.k?"selected":""}>${c.n} (${count(c.k)})</option>`).join("")}</select><span class="grow"></span>${pagerHTML(list.length)}</div>`;
  const rows = pageOf(list).map(e=>`<button class="item ${S.sel===e.id?"on":""}" data-a="open" data-id="${e.id}"><span class="t"><b>${who(e)}</b>${badge(e)}</span><span class="sub" style="display:block">${esc(e.subject)}</span></button>`).join("");
  const pane = S.sel ? `<button class="ghost" data-a="back" style="margin-bottom:10px">← List</button>${detail(byId[S.sel])}` : `<div class="empty">Pick an email to see it here.</div>`;
  return `<div class="B"><div class="top"><span class="logo">BLOCKERIS</span><span class="mute small">Shipping documents</span><span class="grow"></span>${themeBtn()}</div><div class="kpis">${strip}</div>${other}<div class="split ${S.sel?"hasSel":""}"><div class="list">${rows}</div><div class="pane">${pane}</div></div></div>`;
}

/* ---------- Variant C: one at a time ---------- */
function viewC(){
  const q = queue(), total = count("attention"), doneN = total-q.length;
  let inner;
  if(S.mode==="review"){
    const e = q[Math.min(S.qi,q.length-1)];
    if(!e) inner = `<div class="hero"><div class="big">All done</div><p>Nothing left to review.</p><button class="btn" data-a="home">Back to start</button></div>`;
    else inner = `<button class="ghost" data-a="home">← Stop reviewing</button><div class="prog"><i style="width:${100*doneN/total}%"></i></div><div class="mute small num">${doneN+1} of ${total}</div><div class="card">${detail(e,{noActions:true})}<div class="decide"><button class="btn" data-a="decide" data-k="ok" data-id="${e.id}">Looks fine</button><button class="btn alt" data-a="decide" data-k="back" data-id="${e.id}">Send back to sender</button></div><div style="margin-top:10px"><button class="linkbtn" data-a="skip">Skip for now</button></div></div>`;
  } else if(S.mode==="list"){
    const list = items();
    inner = `<button class="ghost" data-a="home">← Start</button><h2 style="margin:12px 0 8px">${catDef(S.cat).n}</h2>${chipsHTML()}<div style="margin:10px 0">${pagerHTML(list.length)}</div>` +
      (S.sel ? `<div class="card">${detail(byId[S.sel])}<button class="ghost" style="margin-top:12px" data-a="back">Close</button></div>` : "") +
      pageOf(list).map(e=>`<button class="li" data-a="open" data-id="${e.id}"><span class="s">${esc(e.subject)}</span>${badge(e)}</button>`).join("");
  } else {
    inner = `<div class="hero"><div class="mute small">Today</div><div class="big num">${q.length}</div><div><b>emails need you</b></div><div class="prog"><i style="width:${100*doneN/total}%"></i></div><div class="mute small num">${doneN} of ${total} done · ${statusCount("MISMATCH")} mismatch · ${statusCount("NEEDS_REVIEW")} need review</div><div style="margin-top:14px"><button class="btn" data-a="start" ${q.length?"":"disabled"}>Start reviewing</button></div></div>
    <h3 style="margin:22px 0 0">Or browse</h3><div class="tiles">${CATS.filter(c=>c.k!=="attention").map(c=>`<button class="tile" data-a="tile" data-k="${c.k}"><b class="num">${count(c.k)}</b>${c.n}</button>`).join("")}</div>`;
  }
  return `<div class="C"><div class="top"><span class="logo">BLOCKERIS</span><span class="mute small">Shipping documents</span><span class="grow"></span>${themeBtn()}</div><div class="page">${inner}</div></div>`;
}

const themeBtn = ()=>`<button class="ghost" data-a="help">How to use</button><button class="ghost" data-a="theme" aria-label="Switch light or dark">Light / Dark</button>`;
const HELP = {
  A:["Pick a folder on the left. Needs attention shows every mismatch and every email that needs a person.","Each page shows 30 emails, newest first. Use Newer and Older to move between pages.","Click an email to open it. Use Back to return to the list."],
  B:["The boxes at the top filter the list: All mail, Mismatch, Needs review, Match.","Use the Show menu to look at one kind of mail, like invoices or SI requests. Each page shows 30 emails, newest first. Use Newer and Older to move between pages.","Click an email to read it on the right. On a phone it opens full screen, and List takes you back."],
  C:["The big number is how many emails need you. Press Start reviewing to go through them one at a time.","Press Looks fine, or Send back to sender, and the next email appears. Skip for now leaves it for later.","To look at other mail, pick a tile under Or browse."]
};
const COMMON = ["Red means the Shipping Instruction and the Bill of Lading disagree. The different field is highlighted. All 7 fields are shown.","Yellow means a person needs to look. The reason is written under the banner.","Green means everything matches and there is nothing to do.","The original documents are shown under the table. Click Original documents to hide them.","When you are done, press Mark as checked. If the Bill of Lading needs fixing, press Send back to sender."];
const helpHTML = ()=>S.help?`<div class="ov" data-a="helpclose"><div class="dlg" role="dialog" aria-label="How to use" data-a="stay"><h2>How to use this page</h2><ol>${HELP[S.v].concat(COMMON).map(t=>`<li>${t}</li>`).join("")}</ol><button class="btn" data-a="helpclose">Got it</button></div></div>`:"";
function render(){
  document.getElementById("app").innerHTML = ({A:viewA,B:viewB,C:viewC})[S.v]() + helpHTML();
  document.getElementById("sw").innerHTML = `<button data-a="var" data-k="-1" aria-label="Previous variant">‹</button><span class="lab">${S.v} : ${VARIANTS[S.v]}</span><button data-a="var" data-k="1" aria-label="Next variant">›</button>`;
  history.replaceState(null,"","?variant="+S.v);
}
function setVariant(d){
  const ks = Object.keys(VARIANTS); S.v = ks[(ks.indexOf(S.v)+d+ks.length)%ks.length];
  S.sel=null; S.page=0; S.more=false; S.body=false; S.mode="home"; render();
}
document.addEventListener("click", ev=>{
  const t = ev.target.closest("[data-a]"); if(!t) return;
  const a=t.dataset.a, k=t.dataset.k, id=t.dataset.id;
  if(a==="stay"||a==="catsel") return;
  if(a==="help"){ S.help=true; return render(); }
  if(a==="helpclose"){ S.help=false; return render(); }
  if(a==="var") return setVariant(+k);
  if(a==="theme"){ const r=document.documentElement; const dark = r.dataset.theme? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme:dark)").matches; r.dataset.theme = dark?"light":"dark"; return; }
  if(a==="cat"){ S.cat=k; S.chip="all"; S.page=0; S.sel=null; }
  else if(a==="chip"){ S.chip=k; S.page=0; S.sel=null; }
  else if(a==="kpi"){ S.cat=t.dataset.cat; S.chip=t.dataset.chip; S.page=0; S.sel=null; }
  else if(a==="newer"){ S.page--; } else if(a==="older"){ S.page++; }
  else if(a==="open"){ S.sel=id; S.more=false; S.body=false; S.docs=true; }
  else if(a==="back"){ S.sel=null; S.more=false; S.body=false; }
  else if(a==="nav"){ const l=items(); const i=l.findIndex(x=>x.id===S.sel)+ +k; if(l[i]){ S.sel=l[i].id; S.more=false; S.body=false; S.docs=true; } }
  else if(a==="docs"){ S.docs=!S.docs; } else if(a==="more"){ S.more=!S.more; } else if(a==="body"){ S.body=!S.body; }
  else if(a==="done"){ S.done[id]=k; }
  else if(a==="start"){ S.mode="review"; S.qi=0; S.more=false; S.body=false; S.docs=true; }
  else if(a==="decide"){ S.done[id]=k; S.more=false; S.body=false; S.docs=true; }
  else if(a==="skip"){ S.qi=(S.qi+1)%Math.max(1,queue().length); S.more=false; S.body=false; S.docs=true; }
  else if(a==="home"){ S.mode="home"; S.sel=null; }
  else if(a==="tile"){ S.mode="list"; S.cat=k; S.chip="all"; S.page=0; S.sel=null; }
  render();
});
document.addEventListener("change", ev=>{
  if(ev.target.dataset.a==="catsel"){ S.cat=ev.target.value; S.chip="all"; S.page=0; S.sel=null; render(); }
});
document.addEventListener("keydown", ev=>{
  if(ev.key==="Escape"&&S.help){ S.help=false; return render(); }
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  if(ev.key==="ArrowLeft") setVariant(-1); if(ev.key==="ArrowRight") setVariant(1);
});
render();
</script>
</body>
</html>
